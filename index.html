<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COBOLCE — Almacén Virtual BPG</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>

*{box-sizing:border-box;margin:0;padding:0}
:root{--n:#1B3A6B;--nl:#2A5BA0;--nd:#0F2347;--g:#F5A800;--gl:#FFCA3A;--r:#CC2200;--bg:#EEF2FA;--bg2:#E2E9F4;--card:#fff;--bdr:#D0D9E8;--bdr2:#B8C7E0;--tx:#1B3A6B;--txm:#5A6E8A;--txl:#9AAABB;--grn-bg:#E6F4EC;--grn-tx:#145230;--amb-bg:#FFF8E6;--amb-tx:#7A4F00;--red-bg:#FCEAE8;--red-tx:#7A1A0E;--rad:8px;--radl:10px;--rads:5px;}
body.dark{--bg:#0B1525;--bg2:#0F1C30;--card:#152238;--bdr:#243550;--bdr2:#2E4266;--tx:#C8D9F0;--txm:#7B96B8;--txl:#4A6080;--grn-bg:#0D2E1A;--grn-tx:#6DD69A;--amb-bg:#2A1F00;--amb-tx:#FFB938;--red-bg:#2A0B08;--red-tx:#FF8070;}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif;font-size:13px;line-height:1.4}
.app{min-height:100vh;display:flex;flex-direction:column;position:relative}
.hdr{background:var(--n);color:#fff;padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:50px;flex-shrink:0}
.hbrand{display:flex;align-items:center;gap:10px}
.htitle b{color:var(--g);font-size:13px;display:block;font-weight:500}
.htitle{font-size:11px;color:rgba(255,255,255,.8);line-height:1.3}
.hsep{width:1px;height:26px;background:rgba(255,255,255,.2)}

.ibtn:hover{background:rgba(255,255,255,.22)}

.searchbar{padding:10px 18px;background:var(--bg2);border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:8px;flex-shrink:0}

.main{flex:1;overflow-y:auto;padding:16px 18px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}

.stn{font-size:20px;font-weight:500;color:var(--n)}

.gch{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}

.bok{background:var(--grn-bg);color:var(--grn-tx)}.bmid{background:var(--amb-bg);color:var(--amb-tx)}.bfull{background:var(--red-bg);color:var(--red-tx)}.bemp{background:var(--bg2);color:var(--txm)}.bpend{background:var(--amb-bg);color:var(--amb-tx)}.brecv{background:var(--grn-bg);color:var(--grn-tx)}.bdel{background:var(--red-bg);color:var(--red-tx)}
.palz{background:var(--amb-bg);border:1px solid #E8D09A;border-radius:var(--rad);padding:10px 12px;margin-bottom:8px}

.agi{background:var(--card);border:1px solid var(--bdr);border-radius:var(--rad);padding:10px 12px;margin-bottom:7px;display:flex;align-items:flex-start;gap:10px}

.agttl{font-size:12px;font-weight:500;color:var(--tx)}.agmeta{font-size:10px;color:var(--txm);margin-top:2px}
.doci{background:var(--card);border:1px solid var(--bdr);border-radius:var(--rad);padding:10px 12px;margin-bottom:7px;display:flex;align-items:center;gap:10px}
.docic{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.docin{font-size:12px;font-weight:500;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.docim{font-size:10px;color:var(--txm);margin-top:2px}
.logr{padding:8px 0;border-bottom:1px solid var(--bdr);display:flex;gap:10px}.logr:last-child{border-bottom:none}
.logd{width:7px;height:7px;border-radius:50%;background:var(--g);flex-shrink:0;margin-top:4px}.logt{font-size:11px;color:var(--tx)}.logm{font-size:10px;color:var(--txm);margin-top:2px}
.btn{padding:6px 11px;border-radius:var(--rad);border:1px solid var(--bdr2);background:var(--card);color:var(--tx);font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:inherit;white-space:nowrap;transition:all .1s}
.btn:hover{background:var(--bg);border-color:var(--n)}.btnp{background:var(--n);border-color:var(--n);color:#fff}.btnp:hover{background:var(--nl);border-color:var(--nl)}
.btnxs{padding:3px 8px;font-size:10px;border-radius:var(--rads)}.btnd{border-color:#E5C0BC;color:var(--r)}.btnd:hover{background:var(--red-bg);border-color:var(--r)}
.brow{display:flex;gap:4px;align-items:center;flex-shrink:0}
.card{background:var(--card);border-radius:var(--radl);border:1px solid var(--bdr);padding:14px}
.nodata{text-align:center;padding:30px 16px;color:var(--txm);font-size:12px}.nodata i{font-size:26px;display:block;margin-bottom:6px;color:var(--txl)}
.sres{background:var(--card);border:1px solid var(--bdr);border-radius:var(--rad);padding:9px 12px;margin-bottom:6px;display:flex;align-items:flex-start;gap:9px;transition:border-color .12s}.sres:hover{border-color:var(--nl)}
.mover{position:absolute;inset:0;background:rgba(5,12,30,.48);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:36px 16px 20px;overflow-y:auto}
.modal{background:var(--card);border-radius:12px;border:1px solid var(--bdr2);width:100%;max-width:460px;display:flex;flex-direction:column;max-height:90vh}
.mlg{max-width:600px}.mhdr{padding:12px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.mttl{font-size:13px;font-weight:500;color:var(--tx)}.mbody{padding:14px 16px;overflow-y:auto;flex:1}.mfoot{padding:10px 16px;border-top:1px solid var(--bdr);display:flex;justify-content:flex-end;gap:7px;flex-shrink:0}
.fg{margin-bottom:10px}.fl{font-size:10px;font-weight:500;color:var(--txm);display:block;margin-bottom:3px}
.fi{width:100%;padding:7px 9px;border-radius:var(--rad);border:1px solid var(--bdr2);font-size:12px;color:var(--tx);background:var(--card);font-family:inherit;outline:none}.fi:focus{border-color:var(--nl)}
select.fi{cursor:pointer}.fr2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.lvblk{border:1px solid var(--bdr);border-radius:var(--rad);margin-bottom:8px;overflow:hidden}
.lvhdr{background:var(--bg2);padding:7px 11px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bdr)}
.lvhdrl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.lvname{font-size:12px;font-weight:500;color:var(--tx)}.lvsp{font-size:9px;padding:2px 7px;border-radius:99px;background:var(--card);border:1px solid var(--bdr);color:var(--txm)}.lvbody{padding:8px 11px}
.ic{display:flex;align-items:flex-start;gap:7px;padding:6px 8px;background:var(--bg2);border-radius:6px;margin-bottom:5px}
.icico{font-size:14px;flex-shrink:0;margin-top:1px}.icinfo{flex:1;min-width:0}.icn{font-size:11px;font-weight:500;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.icm{font-size:10px;color:var(--txm);margin-top:1px}.icp{font-size:9px;padding:1px 5px;border-radius:99px;background:var(--card);border:1px solid var(--bdr);color:var(--tx);display:inline-block;margin-top:2px}.icby{font-size:9px;color:var(--txl);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.upbox{border:2px dashed var(--bdr2);border-radius:var(--rad);padding:20px;text-align:center;cursor:pointer;transition:border-color .15s}.upbox:hover{border-color:var(--nl)}
mark{background:rgba(245,168,0,.3);color:inherit;border-radius:2px;padding:0 1px}
/* NUEVOS */
.disc-nav{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap}
.disc-btn{padding:5px 13px;border-radius:99px;border:1px solid var(--bdr2);background:var(--card);color:var(--txm);font-size:11px;cursor:pointer;font-family:inherit;transition:all .12s}
.disc-btn:hover{background:var(--bg);color:var(--tx)}.disc-btn.act{background:var(--n);border-color:var(--n);color:#fff}
.lista-wrap{background:var(--card);border-radius:var(--radl);border:1px solid var(--bdr);overflow:hidden;overflow-x:auto}
.lista-tbl{width:100%;border-collapse:collapse;min-width:600px}
.lista-tbl th{font-size:9px;font-weight:500;color:var(--txm);text-transform:uppercase;letter-spacing:.06em;padding:7px 10px;text-align:left;border-bottom:1px solid var(--bdr);white-space:nowrap;background:var(--bg2)}
.lista-tbl td{padding:8px 10px;border-bottom:1px solid var(--bdr);font-size:12px;vertical-align:middle}
.lista-tbl tbody tr:last-child td{border-bottom:none}.lista-tbl tbody tr.rg td{background:#EBF7F0}.lista-tbl tbody tr.ry td{background:#FEFAE8}
body.dark .lista-tbl tbody tr.rg td{background:#0D2E1A}body.dark .lista-tbl tbody tr.ry td{background:#2A1F00}
.lista-tbl tbody tr:hover{opacity:.9;cursor:pointer}
.cod{font-family:monospace;font-size:11px;font-weight:600;color:var(--n)}body.dark .cod{color:var(--g)}
.oc-card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--radl);padding:13px 15px;margin-bottom:8px}
.oc-hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.oc-num{font-size:13px;font-weight:600;color:var(--n);font-family:monospace}body.dark .oc-num{color:var(--tx)}
.oc-meta{font-size:10px;color:var(--txm);margin-top:3px}
.flow{display:flex;align-items:center;gap:3px;flex-wrap:wrap;margin-top:7px}
.fstep{font-size:9px;padding:2px 7px;border-radius:99px;border:1px solid var(--bdr);color:var(--txl);background:var(--card)}
.fstep.fdone{background:var(--grn-bg);border-color:var(--grn-tx);color:var(--grn-tx)}.fstep.fact{background:var(--n);border-color:var(--n);color:#fff;font-weight:500}
.farr{font-size:10px;color:var(--txl)}
.oc-mats{margin-top:9px;padding-top:9px;border-top:1px solid var(--bdr)}
.oc-mat{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:11px;color:var(--txm)}
.prov-card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--radl);padding:13px 15px;margin-bottom:8px;display:flex;align-items:flex-start;gap:12px}
.prov-flag{font-size:22px;flex-shrink:0;margin-top:2px}.prov-info{flex:1;min-width:0}.prov-name{font-size:13px;font-weight:500;color:var(--tx)}.prov-meta{font-size:10px;color:var(--txm);margin-top:3px;display:flex;flex-wrap:wrap;gap:6px}
.calc-item{display:flex;align-items:center;gap:9px;padding:8px 11px;background:var(--card);border:1px solid var(--bdr);border-radius:var(--rad);margin-bottom:5px}

.calc-total-n{font-size:24px;font-weight:500}

<body>
<div class="app" id="app"></div>
<script>

const ITYPES=[{id:'box',l:'Caja',ic:'📦'},{id:'pallet',l:'Pallet de material',ic:'🪵'},{id:'spool',l:'Bobina de cable',ic:'🔄'},{id:'tube',l:'Tubo / Conduit',ic:'📏'},{id:'bag',l:'Big Bag',ic:'🎒'},{id:'other',l:'Otro',ic:'📌'}];
const PROJ_HINTS=['Hornos Fase 1','Hornos Fase 2','APE GLP','General','EPP','Material BPG','Mantenimiento','Otro'];
const DISCIPLINAS=[{id:'civil',l:'Civil',ic:'🏗️'},{id:'electrica',l:'Eléctrica',ic:'⚡'},{id:'instrumentacion',l:'Inst. y Control',ic:'🎛️'},{id:'mecanica',l:'Mecánica',ic:'⚙️'}];
const OC_STATES=[{id:'cotizacion',l:'Cotización'},{id:'revision',l:'Rev. Técnica'},{id:'aprobada',l:'Aprobada'},{id:'enviada',l:'OC Enviada'},{id:'transito',l:'En Tránsito'},{id:'aduana',l:'En Aduana'},{id:'recibido',l:'Recibido'}];
const PAISES=['Bolivia','Argentina','Chile','Perú','Brasil','EEUU','Paraguay','China','España','Colombia','Uruguay','Otro'];
const SK={pos:'cobolce-pos',zi:'cobolce-zi',pal:'cobolce-pal',ag:'cobolce-ag',docs:'cobolce-docs',log:'cobolce-log',cfg:'cobolce-cfg',listas:'cobolce-listas',ocs:'cobolce-ocs',provs:'cobolce-provs'};

let S={tab:'mapa',room:'hab1',disc:'civil',user:'',dark:false,
  positions:{},zoneItems:{caseta:[],intemperie:[],cotoca:[]},
  pallets:{hab1:[],hab2:[]},agenda:[],docs:[],changelog:[],
  config:{hab1:{gabs:7,lvls:4,dsp:10},hab2:{gabs:7,lvls:4,dsp:10}},
  listas:{civil:[],electrica:[],instrumentacion:[],mecanica:[]},
  ocs:[],proveedores:[]};
let localLM=0,modal=null,toastMsg='',toastTmr=null,pFile=null,modalMats=[];
let calcItems=[];
let searches={mapa:'',agenda:'',docs:'',registro:'',listas:'',oc:'',proveedores:''};

async function sg(k){try{const r=await fetch('/api/kv/'+encodeURIComponent(k));if(!r.ok)return null;const d=await r.json();return d?JSON.parse(d.value):null;}catch(e){return null;}}
async function ss(k,v){try{await fetch('/api/kv/'+encodeURIComponent(k),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({value:JSON.stringify(v)})});}catch(e){}}
async function loadAll(){
  S.positions=await sg(SK.pos)||{};
  const zi=await sg(SK.zi)||{caseta:[],intemperie:[],cotoca:[]};
  if(!zi.cotoca)zi.cotoca=[];S.zoneItems=zi;
  S.pallets=await sg(SK.pal)||{hab1:[],hab2:[]};
  S.agenda=await sg(SK.ag)||[];S.docs=await sg(SK.docs)||[];S.changelog=await sg(SK.log)||[];
  S.config=await sg(SK.cfg)||{hab1:{gabs:7,lvls:4,dsp:10},hab2:{gabs:7,lvls:4,dsp:10}};
  const ls=await sg(SK.listas)||{civil:[],electrica:[],instrumentacion:[],mecanica:[]};
  DISCIPLINAS.forEach(d=>{if(!ls[d.id])ls[d.id]=[];});S.listas=ls;
  S.ocs=await sg(SK.ocs)||[];S.proveedores=await sg(SK.provs)||[];
  S.user=localStorage.getItem('cobolce-user')||'';
  S.dark=localStorage.getItem('cobolce-dark')==='true';
  if(S.dark)document.body.classList.add('dark');
  try{const r=await fetch('/api/lastmod');const d=await r.json();localLM=d.lm||0;}catch(e){}
}
async function sv(keys){
  if(keys.includes('pos'))await ss(SK.pos,S.positions);
  if(keys.includes('zi'))await ss(SK.zi,S.zoneItems);
  if(keys.includes('pal'))await ss(SK.pal,S.pallets);
  if(keys.includes('ag'))await ss(SK.ag,S.agenda);
  if(keys.includes('docs'))await ss(SK.docs,S.docs);
  if(keys.includes('log'))await ss(SK.log,S.changelog);
  if(keys.includes('cfg'))await ss(SK.cfg,S.config);
  if(keys.includes('listas'))await ss(SK.listas,S.listas);
  if(keys.includes('ocs'))await ss(SK.ocs,S.ocs);
  if(keys.includes('provs'))await ss(SK.provs,S.proveedores);
  localLM=Date.now();
}

function lk(r,g,l){return r+'-G'+g+'-N'+l;}
function gld(r,g,l){const k=lk(r,g,l);if(!S.positions[k])S.positions[k]={sp:S.config[r]?.dsp||10,items:[]};return S.positions[k];}
function gls(r,g,l){return gld(r,g,l).sp||10;}
function glu(r,g,l){return gld(r,g,l).items.reduce((a,i)=>a+(i.sp||1),0);}
function gstat(r,g){const lv=S.config[r]?.lvls||4;let ts=0,us=0;for(let l=1;l<=lv;l++){ts+=gls(r,g,l);us+=glu(r,g,l);}return{ts,us,p:ts>0?us/ts:0};}
function iti(t){return ITYPES.find(x=>x.id===t)||ITYPES[5];}
function lvc(p){return p>=1?'#CC2200':p>=.7?'#F5A800':p>0?'#1E7040':'#C8D5E8';}
function binfo(p){if(p>=1)return{c:'bfull',t:'Lleno'};if(p>=.7)return{c:'bmid',t:'Parcial'};if(p>0)return{c:'bok',t:'Espacio'};return{c:'bemp',t:'Vacío'};}
function fd(iso){if(!iso)return'';const d=new Date(iso);return d.toLocaleDateString('es-BO',{day:'2-digit',month:'2-digit',year:'2-digit'})+' '+d.toLocaleTimeString('es-BO',{hour:'2-digit',minute:'2-digit'});}
function fdS(s){if(!s)return'';const p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function fdate(s){if(!s)return{day:'--',mon:'---'};const p=s.split('-');const ms=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];return{day:p[2],mon:ms[+p[1]-1]};}
function uid(){return Math.random().toString(36).slice(2,9);}
function alog(act,det){S.changelog.unshift({id:uid(),act,det,user:S.user||'Anónimo',ts:new Date().toISOString()});if(S.changelog.length>200)S.changelog=S.changelog.slice(0,200);}
function esc(t){return(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hl(text,q){const safe=esc(text||'');if(!q||!q.trim())return safe;let r=safe;q.trim().split(/\s+/).filter(Boolean).forEach(w=>{const re=new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');r=r.replace(re,m=>'<mark>'+m+'</mark>');});return r;}
function matchStr(str,q){if(!q)return true;return q.toLowerCase().trim().split(/\s+/).every(w=>(str||'').toLowerCase().includes(w));}
function matches(item,q){if(!q)return true;return matchStr([item.desc,item.type,item.proj,item.oc,item.notes,item.unit,item.by,item.llegada].filter(Boolean).join(' '),q);}
function matchLog(l,q){return matchStr([l.act,l.det,l.user].filter(Boolean).join(' '),q);}
function projInput(id,val){return '<input class="fi" list="plist" id="'+id+'" value="'+esc(val||'')+'" placeholder="Hornos Fase 2, EPP..."><datalist id="plist">'+PROJ_HINTS.map(p=>'<option value="'+p+'">').join('')+'</datalist>';}
function getCantComp(cod){if(!cod)return 0;return S.ocs.reduce((t,oc)=>{const m=(oc.materiales||[]).find(m=>m.codigo===cod);return t+(m?+m.qty||0:0);},0);}
function getOCsForCod(cod){if(!cod)return[];return S.ocs.filter(oc=>(oc.materiales||[]).some(m=>m.codigo===cod));}
function getItemCls(item){const c=getCantComp(item.codigo);if(c<=0)return'';if(c>=(+item.cantReq||0)&&item.cantReq>0)return'rg';return'ry';}
function getProvNom(pid){const p=S.proveedores.find(p=>p.id===pid);return p?p.nombre:pid||'—';}
function flagEmoji(pais){const f={Bolivia:'🇧🇴',Argentina:'🇦🇷',Chile:'🇨🇱',Perú:'🇵🇪',Brasil:'🇧🇷',EEUU:'🇺🇸',Paraguay:'🇵🇾',China:'🇨🇳',España:'🇪🇸',Colombia:'🇨🇴',Uruguay:'🇺🇾'};return f[pais]||'🌐';}
function ocBadge(st){const m={recibido:'bok',aduana:'bmid',transito:'bmid',enviada:'bmid',aprobada:'brecv',revision:'bpend',cotizacion:'bemp'};return m[st]||'bemp';}
function allItems(){const a=[];DISCIPLINAS.forEach(d=>(S.listas[d.id]||[]).forEach(i=>a.push(Object.assign({},i,{disc:d.id}))));return a;}

function rMapa(){

      '<span style="font-size:9px;color:var(--txm)">'+esc(r.item.qty+' '+r.item.unit)+'</span></div></div></div>').join('');}
  if(S.room==='caseta'||S.room==='intemperie'||S.room==='cotoca')return rZone(S.room);
  return rRoom(S.room);
}
function searchMapa(q){
  const res=[];
  for(const r of['hab1','hab2']){const cfg=S.config[r]||{gabs:7,lvls:4};const ng=cfg.gabs||7,nl=cfg.lvls||4;const rn=r==='hab1'?'Habitación 1':'Habitación 2';
    for(let g=1;g<=ng;g++)for(let l=1;l<=nl;l++)(gld(r,g,l).items||[]).forEach(item=>{if(matches(item,q))res.push({item,location:rn+' — Gab. '+g+' / Nivel '+l});});
    (S.pallets[r]||[]).forEach(p=>(p.items||[]).forEach(item=>{if(matches(item,q))res.push({item,location:(r==='hab1'?'Hab. 1':'Hab. 2')+' — Pallet: '+p.lbl});}));}
  for(const z of['caseta','intemperie','cotoca'])
    (S.zoneItems[z]||[]).forEach(item=>{if(matches(item,q))res.push({item,location:z==='caseta'?'Caseta de Ladrillos':z==='intemperie'?'Intemperie / Garaje':'Almacén Cotoca'});});
  return res;
}
function rRoom(r){
  const cfg=S.config[r]||{gabs:7,lvls:4,dsp:10};const ng=cfg.gabs||7,nl=cfg.lvls||4;
  let ts=0,us=0,fl=0;for(let g=1;g<=ng;g++){const s=gstat(r,g);ts+=s.ts;us+=s.us;if(s.p>=1)fl++;}
  const rn=r==='hab1'?'Habitación 1':'Habitación 2';const pals=S.pallets[r]||[];
  return'<div class="ph"><div><div class="phtitle">'+rn+'</div><div class="phsub">'+ng+' gabinetes · '+nl+' niveles c/u · '+ts+' espacios totales</div></div>'+
    '<div class="brow"><button class="btn btnxs" onclick="oPallet(\''+r+'\')"><i class="ti ti-plus"></i> Pallet</button><button class="btn btnp btnxs" onclick="oCfg(\''+r+'\')"><i class="ti ti-settings"></i></button></div></div>'+
    '<div class="stats"><div class="stat"><div class="stn">'+ts+'</div><div class="stl">Total</div></div><div class="stat"><div class="stn" style="color:#1E7040">'+(ts-us)+'</div><div class="stl">Disponibles</div></div><div class="stat"><div class="stn" style="color:#F5A800">'+us+'</div><div class="stl">Ocupados</div></div><div class="stat"><div class="stn" style="color:#CC2200">'+fl+'</div><div class="stl">Gab. llenos</div></div></div>'+
    '<div class="stitle">Gabinetes — '+rn+'</div>'+
    '<div class="ggrid">'+Array.from({length:ng},(_,i)=>{const g=i+1;const st=gstat(r,g);const bi=binfo(st.p);
      return'<div class="gc" onclick="oGab(\''+r+'\','+g+')"><div class="gch"><span class="gcn">Gab. '+g+'</span><span class="bdg '+bi.c+'">'+bi.t+'</span></div>'+
      Array.from({length:nl},(_,li)=>{const l=li+1;const sp=gls(r,g,l);const us2=glu(r,g,l);const p=sp>0?us2/sp:0;
        return'<div class="glv"><span class="glvl">N'+l+'</span><div class="glvb"><div class="glvf" style="width:'+Math.min(100,Math.round(p*100))+'%;background:'+lvc(p)+'"></div></div><span class="glvp">'+us2+'/'+sp+'</span></div>';}).join('')+'</div>';}).join('')+'</div>'+
    (pals.length>0?'<div class="stitle" style="margin-top:4px">Pallets en '+rn+'</div>'+pals.map((p,pi)=>'<div class="palz"><div class="palzh"><span>📦 Pallet '+(pi+1)+': '+esc(p.lbl)+'</span><div class="brow"><button class="btn btnxs" onclick="oAddZI(\''+r+'-p-'+p.id+'\',\''+esc(p.lbl)+'\')"><i class="ti ti-plus"></i></button><button class="btn btnxs btnd" onclick="dPallet(\''+r+'\',\''+p.id+'\')"><i class="ti ti-trash"></i></button></div></div>'+
      ((p.items||[]).length===0?'<div style="font-size:11px;color:var(--amb-tx);opacity:.8">Sin ítems</div>':(p.items||[]).map((it,j)=>'<div class="zi" style="background:rgba(255,248,230,0.4)"><span class="ziic">'+iti(it.type).ic+'</span><div class="zii"><div class="zin">'+esc(it.desc)+'</div><div style="font-size:10px;color:var(--txm)">'+it.qty+' '+esc(it.unit)+(it.proj?' · '+esc(it.proj):'')+'</div></div><div class="brow"><button class="btn btnxs" onclick="oEditZI(\''+r+'-p-'+p.id+'\','+j+')"><i class="ti ti-edit"></i></button><button class="btn btnxs btnd" onclick="dZI(\''+r+'-p-'+p.id+'\','+j+')"><i class="ti ti-trash"></i></button></div></div>').join(''))+'</div>').join(''):'');
}

  const completos=allI.filter(i=>getCantComp(i.codigo)>=(+i.cantReq||0)&&i.cantReq>0).length;
  return'<div class="ph"><div><div class="phtitle">Listas de Materiales</div><div class="phsub">Por disciplina · Trazabilidad con Órdenes de Compra</div></div>'+
    '<button class="btn btnp" onclick="oAddLI()"><i class="ti ti-plus"></i> Agregar ítem</button></div>'+
    '<div class="disc-nav">'+DISCIPLINAS.map(d=>'<button class="disc-btn'+(disc===d.id?' act':'')+'" onclick="setDisc(\''+d.id+'\')">'+d.ic+' '+d.l+' <span style="opacity:.7">('+((S.listas[d.id]||[]).length)+')</span></button>').join('')+'</div>'+
    (allI.length>0?'<div class="stats" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px"><div class="stat"><div class="stn">'+allI.length+'</div><div class="stl">En lista</div></div><div class="stat"><div class="stn" style="color:#1E7040">'+completos+'</div><div class="stl">Completos</div></div><div class="stat"><div class="stn" style="color:#F5A800">'+(allI.length-completos)+'</div><div class="stl">Pendientes</div></div></div>':'')+
    (!allI.length?'<div class="nodata"><i class="ti ti-clipboard-off"></i>Sin materiales en la lista. Agrega el primer ítem.</div>':
    !filtered.length?'<div class="nodata"><i class="ti ti-search-off"></i>Sin resultados para "'+esc(q)+'"</div>':
    '<div class="lista-wrap"><table class="lista-tbl"><thead><tr><th>Código</th><th>Descripción</th><th>Und.</th><th style="text-align:right">Req.</th><th style="text-align:right">Comprado</th><th style="text-align:right">Falta</th><th>Estado</th><th></th></tr></thead><tbody>'+
    filtered.map(({item,i})=>{
      const comp=getCantComp(item.codigo);const req=+item.cantReq||0;const falta=Math.max(0,req-comp);const cls=getItemCls(item);

function rOC(){
  const q=searches.oc||'';let ocs=[...S.ocs];
  if(q)ocs=ocs.filter(oc=>matchStr([oc.numero,getProvNom(oc.provId),oc.notas].filter(Boolean).join(' '),q));
  return'<div class="ph"><div><div class="phtitle">Órdenes de Compra</div><div class="phsub">'+S.ocs.length+' OC'+(S.ocs.length!==1?'s':'')+' registradas</div></div>'+
    '<button class="btn btnp" onclick="oAddOC()"><i class="ti ti-plus"></i> Nueva OC</button></div>'+
    (!ocs.length&&q?'<div class="nodata"><i class="ti ti-search-off"></i>Sin resultados</div>':!ocs.length?'<div class="nodata"><i class="ti ti-file-off"></i>Sin órdenes de compra registradas</div>':
    ocs.map(oc=>{const stIdx=OC_STATES.findIndex(s=>s.id===oc.estado);
      return'<div class="oc-card"><div class="oc-hdr"><div style="flex:1;min-width:0">'+
        '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="oc-num">'+hl(oc.numero,q)+'</span><span class="bdg '+ocBadge(oc.estado)+'">'+(OC_STATES.find(s=>s.id===oc.estado)?.l||oc.estado)+'</span></div>'+
        '<div class="oc-meta">'+(oc.provId?'<i class="ti ti-truck" style="font-size:10px;vertical-align:-1px"></i> '+esc(getProvNom(oc.provId))+' · ':'')+

function svLI(){
  if(!S.user){tst('Identifícate primero');return;}
  const disc=document.getElementById('li-disc')?.value||modal.d.disc;
  const cod=document.getElementById('li-cod')?.value?.trim();const desc=document.getElementById('li-desc')?.value?.trim();
  if(!cod){tst('El código es obligatorio');return;}if(!desc){tst('La descripción es obligatoria');return;}
  const origDisc=modal.d.disc;const ei=modal.d.ei;
  const existing=(S.listas[disc]||[]).findIndex(i=>i.codigo===cod);
  if(existing>=0&&(disc!==origDisc||existing!==ei)){tst('El código '+cod+' ya existe en '+DISCIPLINAS.find(d=>d.id===disc)?.l);return;}
  const item={id:uid(),codigo:cod,desc,unidad:document.getElementById('li-und')?.value?.trim()||'',cantReq:+document.getElementById('li-qty')?.value||0,pesoUnit:+document.getElementById('li-pw')?.value||0,notas:document.getElementById('li-notes')?.value?.trim()||'',by:S.user,at:new Date().toISOString()};
  if(!S.listas[disc])S.listas[disc]=[];
  if(ei!==undefined&&disc===origDisc){item.id=S.listas[disc][ei].id;item.by=S.listas[disc][ei].by;item.at=S.listas[disc][ei].at;S.listas[disc][ei]=item;}
  else if(ei!==undefined&&disc!==origDisc){S.listas[origDisc].splice(ei,1);S.listas[disc].push(item);}
  else{S.listas[disc].push(item);}
  S.disc=disc;alog('Ítem '+(ei!==undefined?'editado':'agregado')+' en Lista '+DISCIPLINAS.find(d=>d.id===disc)?.l,cod+' — '+desc);
  sv(['listas','log']);modal=null;render();tst('Ítem guardado');
}
function dLI(disc,idx){if(!confirm('¿Eliminar este ítem de la lista?'))return;const n=S.listas[disc][idx]?.desc;S.listas[disc].splice(idx,1);alog('Ítem eliminado de Lista '+DISCIPLINAS.find(d=>d.id===disc)?.l,n);sv(['listas','log']);render();tst('Ítem eliminado');}

function oAddOC(){modalMats=[];modal={s:'oc',d:{}};render();}
function oEditOC(id){const idx=S.ocs.findIndex(o=>o.id===id);const oc=S.ocs[idx];modalMats=[...(oc.materiales||[])];modal={s:'oc',d:{ei:idx,item:{...oc}}};render();}
function autoFillMD(){const cod=document.getElementById('nm-cod')?.value?.trim();if(!cod)return;for(const items of Object.values(S.listas)){const f=items.find(i=>i.codigo===cod);if(f){const d=document.getElementById('nm-desc');const u=document.getElementById('nm-und');if(d&&!d.value)d.value=f.desc;if(u&&!u.value)u.value=f.unidad||'';return;}}}
function addMM(){const cod=document.getElementById('nm-cod')?.value?.trim()||'';let desc=document.getElementById('nm-desc')?.value?.trim()||'';const qty=+document.getElementById('nm-qty')?.value||0;const unidad=document.getElementById('nm-und')?.value?.trim()||'';if(!cod&&!desc){tst('Ingresa código o descripción');return;}if(!qty){tst('Ingresa la cantidad');return;}if(cod&&!desc){for(const items of Object.values(S.listas)){const f=items.find(i=>i.codigo===cod);if(f){desc=f.desc;break;}}}modalMats.push({codigo:cod,desc,qty,unidad});render();}
function rmMM(i){modalMats.splice(i,1);render();}
function svOC(){
  if(!S.user){tst('Identifícate primero');return;}
  const numero=document.getElementById('oc-num')?.value?.trim();if(!numero){tst('Ingresa el número de OC');return;}
  const oc={id:uid(),numero,provId:document.getElementById('oc-prov')?.value||'',fechaEmision:document.getElementById('oc-fe')?.value||'',fechaEntrega:document.getElementById('oc-fd')?.value||'',estado:document.getElementById('oc-est')?.value||'cotizacion',materiales:[...modalMats],notas:document.getElementById('oc-notes')?.value?.trim()||'',by:S.user,at:new Date().toISOString()};
  const ei=modal.d?.ei;
  if(ei!==undefined){oc.id=S.ocs[ei].id;oc.by=S.ocs[ei].by;oc.at=S.ocs[ei].at;S.ocs[ei]=oc;alog('OC actualizada',numero);}
  else{S.ocs.push(oc);alog('OC registrada',numero+(oc.provId?' · '+getProvNom(oc.provId):''));}
  sv(['ocs','log']);modal=null;render();tst('OC guardada');
}
function dOC(id){if(!confirm('¿Eliminar esta OC?'))return;const o=S.ocs.find(x=>x.id===id);S.ocs=S.ocs.filter(x=>x.id!==id);alog('OC eliminada',o?.numero||'');sv(['ocs','log']);render();tst('OC eliminada');}

function oAddProv(){modal={s:'prov',d:{}};render();}
function oEditProv(id){const idx=S.proveedores.findIndex(p=>p.id===id);const p=S.proveedores[idx];modal={s:'prov',d:{ei:idx,item:{...p}}};render();}
function svProv(){
  if(!S.user){tst('Identifícate primero');return;}
  const nombre=document.getElementById('pv-nom')?.value?.trim();if(!nombre){tst('Ingresa el nombre del proveedor');return;}
  const p={id:uid(),nombre,pais:document.getElementById('pv-pais')?.value||'',contacto:document.getElementById('pv-con')?.value?.trim()||'',telefono:document.getElementById('pv-tel')?.value?.trim()||'',email:document.getElementById('pv-email')?.value?.trim()||'',notas:document.getElementById('pv-notes')?.value?.trim()||'',by:S.user,at:new Date().toISOString()};
  const ei=modal.d?.ei;
  if(ei!==undefined){p.id=S.proveedores[ei].id;p.by=S.proveedores[ei].by;p.at=S.proveedores[ei].at;S.proveedores[ei]=p;alog('Proveedor actualizado',nombre);}
  else{S.proveedores.push(p);alog('Proveedor registrado',nombre+(p.pais?' ('+p.pais+')':''));}
  sv(['provs','log']);modal=null;render();tst('Proveedor guardado');
}
function dProv(id){if(!confirm('¿Eliminar este proveedor?'))return;const p=S.proveedores.find(x=>x.id===id);S.proveedores=S.proveedores.filter(x=>x.id!==id);alog('Proveedor eliminado',p?.nombre||'');sv(['provs','log']);render();tst('Proveedor eliminado');}

function oAddAg(){modal={s:'ag',d:{}};render();}
function oEditAg(id){const item=S.agenda.find(a=>a.id===id);modal={s:'ag',d:{item:{...item}}};render();}
function svAg(){if(!S.user){tst('Identifícate primero');return;}const date=document.getElementById('a-dt')?.value;const mat=document.getElementById('a-m')?.value?.trim();if(!date||!mat){tst('Completa fecha y descripción');return;}const en={id:uid(),date,material:mat,supplier:document.getElementById('a-s')?.value?.trim()||'',proj:document.getElementById('a-p')?.value?.trim()||'',oc:document.getElementById('a-o')?.value?.trim()||'',notes:document.getElementById('a-n')?.value?.trim()||'',status:document.getElementById('a-st')?.value||'pending',by:S.user,at:new Date().toISOString()};const ei=modal.d?.item;if(ei){const idx=S.agenda.findIndex(a=>a.id===ei.id);if(idx>=0){en.id=ei.id;en.by=ei.by;en.at=ei.at;S.agenda[idx]=en;}}else S.agenda.push(en);alog(ei?'Entrega actualizada':'Entrega registrada en agenda',mat);sv(['ag','log']);modal=null;render();tst('Entrega guardada');}
function dAg(id){if(!confirm('¿Eliminar esta entrega?'))return;const a=S.agenda.find(x=>x.id===id);S.agenda=S.agenda.filter(x=>x.id!==id);alog('Entrega eliminada',a?.material||'');sv(['ag','log']);render();tst('Entrega eliminada');}

function oUpDoc(){pFile=null;modal={s:'doc',d:{}};render();}
function hFile(e){const file=e.target.files[0];if(!file)return;pFile={file,name:file.name,size:file.size};const ul=document.getElementById('ul');if(ul)ul.textContent='✓ '+file.name+' ('+Math.round(file.size/1024)+' KB)';const ub=document.getElementById('ub');if(ub)ub.style.borderColor='#F5A800';}
async function svDoc(){const by=document.getElementById('d-b')?.value?.trim()||S.user||'Anónimo';const notes=document.getElementById('d-n')?.value?.trim()||'';let fileId=null,fileName=null;if(pFile?.file){tst('Subiendo archivo...');try{const fd2=new FormData();fd2.append('archivo',pFile.file,pFile.name);const r=await fetch('/api/archivos',{method:'POST',body:fd2});const res=await r.json();if(res.id){fileId=res.id;fileName=res.nombre;}}catch(e){tst('Error al subir archivo');}}const name=fileName||pFile?.name||(notes||'Documento sin archivo');const doc={id:uid(),name,by,at:new Date().toISOString(),proj:document.getElementById('d-p')?.value?.trim()||'',zone:document.getElementById('d-z')?.value?.trim()||'',notes,hasData:!!fileId,fileId};S.docs.unshift(doc);alog('Documento registrado',name+' · por '+by);sv(['docs','log']);pFile=null;modal=null;render();tst('Documento registrado');}
function dlDoc(fileId,nombre){const a=document.createElement('a');a.href='/api/archivos/'+fileId;a.download=nombre;a.click();}
function dDoc(id){if(!confirm('¿Eliminar este documento?'))return;const doc=S.docs.find(d=>d.id===id);S.docs=S.docs.filter(d=>d.id!==id);if(doc?.fileId)fetch('/api/archivos/'+doc.fileId,{method:'DELETE'}).catch(()=>{});alog('Documento eliminado',doc?.name||'');sv(['docs','log']);render();tst('Documento eliminado');}
function clrLog(){if(!confirm('¿Limpiar registro?'))return;S.changelog=[];sv(['log']);render();tst('Registro limpiado');}

function autoFillCalc(){const cod=document.getElementById('calc-cod')?.value?.trim();if(!cod)return;for(const items of Object.values(S.listas)){const f=items.find(i=>i.codigo===cod);if(f){const d=document.getElementById('calc-desc');const p=document.getElementById('calc-pw');if(d&&!d.value)d.value=f.desc;if(p&&!p.value&&f.pesoUnit)p.value=f.pesoUnit;return;}}}
function addCalcItem(){const cod=document.getElementById('calc-cod')?.value?.trim()||'';let desc=document.getElementById('calc-desc')?.value?.trim()||'';let pw=parseFloat(document.getElementById('calc-pw')?.value)||0;const qty=parseFloat(document.getElementById('calc-qty')?.value)||1;if(cod&&!desc){for(const items of Object.values(S.listas)){const f=items.find(i=>i.codigo===cod);if(f){desc=f.desc;if(!pw&&f.pesoUnit)pw=f.pesoUnit;break;}}}if(!desc&&!cod){tst('Ingresa un código o descripción');return;}if(!pw){tst('Ingresa el peso unitario en kg');return;}calcItems.push({cod,desc:desc||cod,pesoUnit:pw,qty,subtotal:pw*qty});render();}
function removeCalcItem(i){calcItems.splice(i,1);render();}
function clearCalc(){calcItems=[];render();}

function tst(msg){toastMsg=msg;clearTimeout(toastTmr);render();toastTmr=setTimeout(()=>{toastMsg='';render();},3000);}
async function poll(){try{const r=await fetch('/api/lastmod');const d=await r.json();if(d.lm>localLM){await loadAll();render();}}catch(e){}}
async function init(){await loadAll();if(!S.user)modal={s:'usr',d:{}};render();setInterval(poll,20000);}
init();

</script>
</body>
