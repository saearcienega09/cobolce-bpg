<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COBOLCE — Almacén Virtual BPG</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --n:#1B3A6B;--nl:#2A5BA0;--nd:#0F2347;
  --g:#F5A800;--gl:#FFCA3A;--r:#CC2200;
  --bg:#EEF2FA;--bg2:#E2E9F4;--card:#fff;
  --bdr:#D0D9E8;--bdr2:#B8C7E0;
  --tx:#1B3A6B;--txm:#5A6E8A;--txl:#9AAABB;
  --grn-bg:#E6F4EC;--grn-tx:#145230;
  --amb-bg:#FFF8E6;--amb-tx:#7A4F00;
  --red-bg:#FCEAE8;--red-tx:#7A1A0E;
  --rad:8px;--radl:10px;--rads:5px;
}
body.dark{
  --bg:#0B1525;--bg2:#0F1C30;--card:#152238;
  --bdr:#243550;--bdr2:#2E4266;
  --tx:#C8D9F0;--txm:#7B96B8;--txl:#4A6080;
  --grn-bg:#0D2E1A;--grn-tx:#6DD69A;
  --amb-bg:#2A1F00;--amb-tx:#FFB938;
  --red-bg:#2A0B08;--red-tx:#FF8070;
}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif;font-size:13px;line-height:1.4}
.app{min-height:100vh;display:flex;flex-direction:column;position:relative}
.hdr{background:var(--n);color:#fff;padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:50px;flex-shrink:0}
.hbrand{display:flex;align-items:center;gap:10px}
.htitle b{color:var(--g);font-size:13px;display:block;font-weight:500}
.htitle{font-size:11px;color:rgba(255,255,255,.8);line-height:1.3}
.hsep{width:1px;height:26px;background:rgba(255,255,255,.2)}
.hright{display:flex;align-items:center;gap:7px}
.ibtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:4px 11px;color:rgba(255,255,255,.88);font-size:11px;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:inherit;transition:background .12s}
.ibtn:hover{background:rgba(255,255,255,.22)}
.sync{font-size:10px;color:rgba(255,255,255,.4);display:flex;align-items:center;gap:4px}
.sdot{width:5px;height:5px;border-radius:50%;background:#4CAF50;flex-shrink:0}
.tabs{background:var(--nd);display:flex;padding:0 16px;border-bottom:2px solid var(--g);overflow-x:auto;flex-shrink:0}
.tab{padding:9px 13px;font-size:12px;font-weight:500;color:rgba(255,255,255,.5);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:5px;white-space:nowrap;transition:color .12s}
.tab i{font-size:12px}
.tab:hover{color:rgba(255,255,255,.85)}
.tab.act{color:var(--g);border-bottom-color:var(--g)}
.tbanner{background:var(--n);color:#fff;padding:6px 16px;font-size:12px;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;border-bottom:2px solid var(--g);flex-shrink:0}
.searchbar{padding:10px 18px;background:var(--bg2);border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:8px;flex-shrink:0}
.searchbar i{font-size:15px;color:var(--txm);flex-shrink:0}
.srch{flex:1;border:1px solid var(--bdr2);border-radius:99px;padding:5px 12px;font-size:12px;background:var(--card);color:var(--tx);font-family:inherit;outline:none}
.srch:focus{border-color:var(--nl)}
.clrbtn{background:none;border:none;cursor:pointer;color:var(--txm);font-size:14px;padding:2px;display:flex;align-items:center}
.body{flex:1;display:flex;min-height:0}
.sb{width:150px;background:var(--card);border-right:1px solid var(--bdr);flex-shrink:0;padding:10px 0;overflow-y:auto}
.sblbl{font-size:9px;font-weight:500;color:var(--txl);letter-spacing:.09em;text-transform:uppercase;padding:0 14px;margin:10px 0 5px}
.sbi{padding:7px 12px;cursor:pointer;font-size:12px;color:var(--txm);display:flex;align-items:flex-start;gap:7px;border-left:2px solid transparent;transition:all .12s}
.sbi i{font-size:13px;margin-top:1px;flex-shrink:0}
.sbi:hover{background:var(--bg);color:var(--tx)}
.sbi.act{background:var(--bg);color:var(--n);font-weight:500;border-left-color:var(--g)}
.sbsub{font-size:10px;color:var(--txl);margin-top:1px}
.main{flex:1;overflow-y:auto;padding:16px 18px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:13px;gap:8px}
.phtitle{font-size:14px;font-weight:500;color:var(--n)}
body.dark .phtitle{color:var(--tx)}
.phsub{font-size:11px;color:var(--txm);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bdr);border-radius:var(--rad);padding:9px 10px;text-align:center}
.stn{font-size:20px;font-weight:500;color:var(--n)}
body.dark .stn{color:var(--tx)}
.stl{font-size:9px;color:var(--txm);text-transform:uppercase;letter-spacing:.05em;margin-top:1px}
.stitle{font-size:10px;font-weight:500;color:var(--txm);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:8px;margin-bottom:12px}
.gc{background:var(--card);border:1px solid var(--bdr);border-radius:var(--rad);padding:9px;cursor:pointer;transition:border-color .13s,transform .12s}
.gc:hover{border-color:var(--nl);transform:translateY(-1px)}
.gch{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.gcn{font-size:10px;font-weight:500;color:var(--txm)}
.glv{display:flex;align-items:center;gap:4px;margin-bottom:3px}
.glvl{font-size:9px;color:var(--txl);width:13px;flex-shrink:0}
.glvb{flex:1;height:4px;background:var(--bg2);border-radius:2px;overflow:hidden}
.glvf{height:100%;border-radius:2px}
.glvp{font-size:9px;color:var(--txm);width:25px;text-align:right;flex-shrink:0}
.bdg{font-size:9px;padding:1px 5px;border-radius:99px;font-weight:500}
.bok{background:var(--grn-bg);color:var(--grn-tx)}
.bmid{background:var(--amb-bg);color:var(--amb-tx)}
.bfull{background:var(--red-bg);color:var(--red-tx)}
.bemp{background:var(--bg2);color:var(--txm)}
.bpend{background:var(--amb-bg);color:var(--amb-tx)}
.brecv{background:var(--grn-bg);color:var(--grn-tx)}
.bdel{background:var(--red-bg);color:var(--red-tx)}
.palz{background:var(--amb-bg);border:1px solid #E8D09A;border-radius:var(--rad);padding:10px 12px;margin-bottom:8px}
body.dark .palz{border-color:#4A3800}
.palzh{font-size:11px;font-weight:500;color:var(--amb-tx);margin-bottom:7px;display:flex;align-items:center;justify-content:space-between}
.zi{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:var(--card);border:1px solid var(--bdr);border-radius:var(--rad);margin-bottom:5px}
.ziic{font-size:15px;flex-shrink:0;margin-top:1px}
.zii{flex:1;min-width:0}
.zin{font-size:11px;font-weight:500;color:var(--tx)}
.zim{font-size:10px;color:var(--txm);margin-top:1px}
.agi{background:var(--card);border:1px solid var(--bdr);border-radius:var(--rad);padding:10px 12px;margin-bottom:7px;display:flex;align-items:flex-start;gap:10px}
.agd{background:var(--n);color:#fff;border-radius:6px;padding:4px 7px;text-align:center;flex-shrink:0;min-width:40px}
.agday{font-size:17px;font-weight:500;line-height:1}
.agmon{font-size:8px;text-transform:uppercase;letter-spacing:.05em;opacity:.8}
.agttl{font-size:12px;font-weight:500;color:var(--tx)}
.agmeta{font-size:10px;color:var(--txm);margin-top:2px}
.doci{background:var(--card);border:1px solid var(--bdr);border-radius:var(--rad);padding:10px 12px;margin-bottom:7px;display:flex;align-items:center;gap:10px}
.docic{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.docin{font-size:12px;font-weight:500;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docim{font-size:10px;color:var(--txm);margin-top:2px}
.logr{padding:8px 0;border-bottom:1px solid var(--bdr);display:flex;gap:10px}
.logr:last-child{border-bottom:none}
.logd{width:7px;height:7px;border-radius:50%;background:var(--g);flex-shrink:0;margin-top:4px}
.logt{font-size:11px;color:var(--tx)}
.logm{font-size:10px;color:var(--txm);margin-top:2px}
.btn{padding:6px 11px;border-radius:var(--rad);border:1px solid var(--bdr2);background:var(--card);color:var(--tx);font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:inherit;white-space:nowrap;transition:all .1s}
.btn:hover{background:var(--bg);border-color:var(--nl)}
.btnp{background:var(--n);border-color:var(--n);color:#fff}
.btnp:hover{background:var(--nl);border-color:var(--nl)}
.btnxs{padding:3px 8px;font-size:10px;border-radius:var(--rads)}
.btnd{border-color:#E5C0BC;color:var(--r)}
.btnd:hover{background:var(--red-bg);border-color:var(--r)}
.brow{display:flex;gap:4px;align-items:center;flex-shrink:0}
.card{background:var(--card);border-radius:var(--radl);border:1px solid var(--bdr);padding:14px}
.nodata{text-align:center;padding:30px 16px;color:var(--txm);font-size:12px}
.nodata i{font-size:26px;display:block;margin-bottom:6px;color:var(--txl)}
.sres{background:var(--card);border:1px solid var(--bdr);border-radius:var(--rad);padding:9px 12px;margin-bottom:6px;display:flex;align-items:flex-start;gap:9px;cursor:pointer;transition:border-color .12s}
.sres:hover{border-color:var(--nl)}
.sres-loc{font-size:10px;color:var(--txm);margin-top:2px}
.sres-ic{font-size:15px;flex-shrink:0;margin-top:2px}
.sres-name{font-size:12px;font-weight:500;color:var(--tx)}
.mover{position:absolute;inset:0;background:rgba(5,12,30,.48);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:36px 16px 20px;overflow-y:auto}
.modal{background:var(--card);border-radius:12px;border:1px solid var(--bdr2);width:100%;max-width:460px;display:flex;flex-direction:column;max-height:90vh}
.mlg{max-width:560px}
.mhdr{padding:12px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.mttl{font-size:13px;font-weight:500;color:var(--tx)}
.mbody{padding:14px 16px;overflow-y:auto;flex:1}
.mfoot{padding:10px 16px;border-top:1px solid var(--bdr);display:flex;justify-content:flex-end;gap:7px;flex-shrink:0}
.fg{margin-bottom:10px}
.fl{font-size:10px;font-weight:500;color:var(--txm);display:block;margin-bottom:3px}
.fi{width:100%;padding:7px 9px;border-radius:var(--rad);border:1px solid var(--bdr2);font-size:12px;color:var(--tx);background:var(--card);font-family:inherit;outline:none}
.fi:focus{border-color:var(--nl)}
select.fi{cursor:pointer}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.lvblk{border:1px solid var(--bdr);border-radius:var(--rad);margin-bottom:8px;overflow:hidden}
.lvhdr{background:var(--bg2);padding:7px 11px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bdr)}
.lvhdrl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lvname{font-size:12px;font-weight:500;color:var(--tx)}
.lvsp{font-size:9px;padding:2px 7px;border-radius:99px;background:var(--card);border:1px solid var(--bdr);color:var(--txm)}
.lvbody{padding:8px 11px}
.ic{display:flex;align-items:flex-start;gap:7px;padding:6px 8px;background:var(--bg2);border-radius:6px;margin-bottom:5px}
.icico{font-size:14px;flex-shrink:0;margin-top:1px}
.icinfo{flex:1;min-width:0}
.icn{font-size:11px;font-weight:500;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icm{font-size:10px;color:var(--txm);margin-top:1px}
.icp{font-size:9px;padding:1px 5px;border-radius:99px;background:var(--card);border:1px solid var(--bdr);color:var(--tx);display:inline-block;margin-top:2px}
.icby{font-size:9px;color:var(--txl);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.upbox{border:2px dashed var(--bdr2);border-radius:var(--rad);padding:20px;text-align:center;cursor:pointer;transition:border-color .15s}
.upbox:hover{border-color:var(--nl)}
mark{background:rgba(245,168,0,.3);color:inherit;border-radius:2px;padding:0 1px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const ITYPES=[
  {id:'box',l:'Caja',ic:'📦'},{id:'pallet',l:'Pallet de material',ic:'🪵'},
  {id:'spool',l:'Bobina de cable',ic:'🔄'},{id:'tube',l:'Tubo / Conduit',ic:'📏'},
  {id:'bag',l:'Big Bag',ic:'🎒'},{id:'other',l:'Otro',ic:'📌'}
];
const PROJ_HINTS=['Hornos Fase 1','Hornos Fase 2','APE GLP','General','EPP','Material BPG','Mantenimiento','Otro'];
const SK={pos:'cobolce-pos',zi:'cobolce-zi',pal:'cobolce-pal',ag:'cobolce-ag',
  docs:'cobolce-docs',log:'cobolce-log',cfg:'cobolce-cfg'};

let S={tab:'mapa',room:'hab1',user:'',dark:false,
  positions:{},zoneItems:{caseta:[],intemperie:[]},
  pallets:{hab1:[],hab2:[]},
  agenda:[],docs:[],changelog:[],
  config:{hab1:{gabs:7,lvls:4,dsp:10},hab2:{gabs:7,lvls:4,dsp:10}}};
let localLM=0,modal=null,toastMsg='',toastTmr=null,pFile=null;
let searches={mapa:'',agenda:'',docs:'',registro:''};

/* === STORAGE (backend API) === */
async function sg(k){
  try{
    const r=await fetch(`/api/kv/${encodeURIComponent(k)}`);
    if(!r.ok)return null;
    const d=await r.json();
    return d?JSON.parse(d.value):null;
  }catch(e){return null;}
}
async function ss(k,v){
  try{
    await fetch(`/api/kv/${encodeURIComponent(k)}`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({value:JSON.stringify(v)})
    });
  }catch(e){}
}

async function loadAll(){
  S.positions=await sg(SK.pos)||{};
  S.zoneItems=await sg(SK.zi)||{caseta:[],intemperie:[]};
  S.pallets=await sg(SK.pal)||{hab1:[],hab2:[]};
  S.agenda=await sg(SK.ag)||[];
  S.docs=await sg(SK.docs)||[];
  S.changelog=await sg(SK.log)||[];
  S.config=await sg(SK.cfg)||{hab1:{gabs:7,lvls:4,dsp:10},hab2:{gabs:7,lvls:4,dsp:10}};
  S.user=localStorage.getItem('cobolce-user')||'';
  S.dark=localStorage.getItem('cobolce-dark')==='true';
  if(S.dark)document.body.classList.add('dark');
  try{const r=await fetch('/api/lastmod');const d=await r.json();localLM=d.lm||0;}catch(e){}
}
async function sv(keys){
  if(keys.includes('pos'))await ss(SK.pos,S.positions);
  if(keys.includes('zi'))await ss(SK.zi,S.zoneItems);
  if(keys.includes('pal'))await ss(SK.pal,S.pallets);
  if(keys.includes('ag'))await ss(SK.ag,S.agenda);
  if(keys.includes('docs'))await ss(SK.docs,S.docs);
  if(keys.includes('log'))await ss(SK.log,S.changelog);
  if(keys.includes('cfg'))await ss(SK.cfg,S.config);
  localLM=Date.now();
}

/* === HELPERS === */
function lk(r,g,l){return`${r}-G${g}-N${l}`;}
function gld(r,g,l){const k=lk(r,g,l);if(!S.positions[k])S.positions[k]={sp:S.config[r]?.dsp||10,items:[]};return S.positions[k];}
function gls(r,g,l){return gld(r,g,l).sp||10;}
function glu(r,g,l){return gld(r,g,l).items.reduce((a,i)=>a+(i.sp||1),0);}
function gstat(r,g){const lv=S.config[r]?.lvls||4;let ts=0,us=0;for(let l=1;l<=lv;l++){ts+=gls(r,g,l);us+=glu(r,g,l);}return{ts,us,p:ts>0?us/ts:0};}
function iti(t){return ITYPES.find(x=>x.id===t)||ITYPES[5];}
function lvc(p){return p>=1?'#CC2200':p>=.7?'#F5A800':p>0?'#1E7040':'#C8D5E8';}
function binfo(p){if(p>=1)return{c:'bfull',t:'Lleno'};if(p>=.7)return{c:'bmid',t:'Parcial'};if(p>0)return{c:'bok',t:'Espacio'};return{c:'bemp',t:'Vacío'};}
function fd(iso){if(!iso)return'';const d=new Date(iso);return d.toLocaleDateString('es-BO',{day:'2-digit',month:'2-digit',year:'2-digit'})+' '+d.toLocaleTimeString('es-BO',{hour:'2-digit',minute:'2-digit'});}
function fdShort(s){if(!s)return'';const[y,m,d]=s.split('-');return`${d}/${m}/${y}`;}
function fdate(s){if(!s)return{day:'--',mon:'---'};const[y,m,d]=s.split('-');return{day:d,mon:['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'][+m-1]};}
function uid(){return Math.random().toString(36).slice(2,9);}
function alog(act,det){S.changelog.unshift({id:uid(),act,det,user:S.user||'Anónimo',ts:new Date().toISOString()});if(S.changelog.length>200)S.changelog=S.changelog.slice(0,200);}
function hl(text,q){
  if(!q||!text)return text||'';
  const safe=text.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  if(!q.trim())return safe;
  const words=q.trim().split(/\s+/).filter(Boolean);
  let result=safe;
  words.forEach(w=>{const re=new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');result=result.replace(re,m=>`<mark>${m}</mark>`);});
  return result;
}
function matches(item,q){
  if(!q)return true;
  const txt=[item.desc,item.type,item.proj,item.oc,item.notes,item.unit,item.by,item.llegada].filter(Boolean).join(' ').toLowerCase();
  return q.toLowerCase().trim().split(/\s+/).every(w=>txt.includes(w));
}
function matchLog(l,q){
  if(!q)return true;
  const txt=[l.act,l.det,l.user].filter(Boolean).join(' ').toLowerCase();
  return q.toLowerCase().trim().split(/\s+/).every(w=>txt.includes(w));
}

/* === RENDER === */
function render(){document.getElementById('app').innerHTML=rApp();}

function rApp(){
  const t=localLM?new Date(localLM).toLocaleTimeString('es-BO',{hour:'2-digit',minute:'2-digit'}):'—';
  return`<div class="app">
    ${toastMsg?`<div class="tbanner"><i class="ti ti-check-circle" aria-hidden="true" style="font-size:13px"></i>${toastMsg}</div>`:''}
    <div class="hdr">
      <div class="hbrand">
        <svg width="26" height="28" viewBox="0 0 26 28" fill="none" aria-hidden="true">
          <path d="M13 1C11 6 7 8 7 14c0 5 3 8 6 10-3-3-4-6-2.5-10 1 3 2.5 5 2.5 5s1.5-3 1.5-6c1 2.5 1 6-.5 8.5 3-2 5-5 5-7.5 0-6-4-8-6-13z" fill="#F5A800"/>
          <path d="M13 5c-1 3-4 5-4 9 0 3 2 6 4 8-2-3-3-5-2-8 1 2 2 3.5 2 3.5s1.5-2.5 1.5-5c.5 2 .5 5-.5 7 2-2 3-4 3-6 0-4-2-6-4-9z" fill="#CC2200"/>
        </svg>
        <div class="hsep"></div>
        <div class="htitle"><b>COBOLCE</b>Almacén Virtual BPG</div>
      </div>
      <div class="hright">
        <div class="sync"><span class="sdot"></span>Sync ${t}</div>
        <button class="ibtn" onclick="toggleDark()">
          <i class="ti ${S.dark?'ti-sun':'ti-moon'}" aria-hidden="true" style="font-size:13px"></i>
          ${S.dark?'Claro':'Oscuro'}
        </button>
        <button class="ibtn" onclick="showUsr()">
          <i class="ti ti-user-circle" aria-hidden="true" style="font-size:13px"></i>
          ${S.user||'Identificarse'}
        </button>
      </div>
    </div>
    <div class="tabs">${[
      {id:'mapa',ic:'ti-building-warehouse',l:'Mapa del almacén'},
      {id:'agenda',ic:'ti-calendar-event',l:'Agenda'},
      {id:'docs',ic:'ti-file-description',l:'Documentos'},
      {id:'registro',ic:'ti-history',l:'Registro'},
    ].map(t=>`<div class="tab${S.tab===t.id?' act':''}" onclick="setTab('${t.id}')"><i class="ti ${t.ic}" aria-hidden="true"></i>${t.l}</div>`).join('')}</div>

function rSP(){const ps={mapa:'Buscar material por nombre, OC, proyecto...',agenda:'Buscar entrega...',docs:'Buscar documento...',registro:'Buscar en registro...'};return ps[S.tab]||'Buscar...';}

function rMapa(){
  const q=searches.mapa;
  if(q){
    const res=searchMapa(q);
    if(!res.length)return`<div class="nodata"><i class="ti ti-search-off" aria-hidden="true"></i>Sin resultados para "${q}"</div>`;
    return`<div style="margin-bottom:8px;font-size:11px;color:var(--txm)">${res.length} resultado${res.length>1?'s':''} encontrado${res.length>1?'s':''}</div>
    ${res.map(r=>`<div class="sres" onclick="${r.gabClick||''}">
      <span class="sres-ic">${iti(r.item.type).ic}</span>
      <div style="flex:1;min-width:0">
        <div class="sres-name">${hl(r.item.desc,q)}</div>
        <div class="sres-loc"><i class="ti ti-map-pin" aria-hidden="true" style="font-size:10px;vertical-align:-1px"></i> ${r.location}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:3px">
          ${r.item.proj?`<span style="font-size:9px;padding:1px 5px;border-radius:99px;background:var(--bg2);color:var(--tx)">${hl(r.item.proj,q)}</span>`:''}
          ${r.item.oc?`<span style="font-size:9px;color:var(--txm);font-family:monospace">${hl(r.item.oc,q)}</span>`:''}
          ${r.item.llegada?`<span style="font-size:9px;color:var(--txm)">Llegó: ${fdShort(r.item.llegada)}</span>`:''}
          <span style="font-size:9px;color:var(--txm)">${r.item.qty} ${r.item.unit}</span>
        </div>
      </div>
    </div>`).join('')}`;
  }
  if(S.room==='caseta')return rZone('caseta');
  if(S.room==='intemperie')return rZone('intemperie');
  return rRoom(S.room);
}

function searchMapa(q){
  const res=[];
  for(const r of['hab1','hab2']){
    const cfg=S.config[r]||{gabs:7,lvls:4};const ng=cfg.gabs||7,nl=cfg.lvls||4;
    const rn=r==='hab1'?'Habitación 1':'Habitación 2';
    for(let g=1;g<=ng;g++)for(let l=1;l<=nl;l++)
      (gld(r,g,l).items||[]).forEach(item=>{
        if(matches(item,q))res.push({item,location:`${rn} — Gab. ${g} / Nivel ${l}`,gabClick:`oGab('${r}',${g})`});
      });
    (S.pallets[r]||[]).forEach(p=>(p.items||[]).forEach(item=>{
      if(matches(item,q))res.push({item,location:`${r==='hab1'?'Hab. 1':'Hab. 2'} — Pallet: ${p.lbl}`});
    }));
  }
  for(const z of['caseta','intemperie'])
    (S.zoneItems[z]||[]).forEach(item=>{
      if(matches(item,q))res.push({item,location:z==='caseta'?'Caseta de Ladrillos':'Intemperie / Garaje'});
    });
  return res;
}

function rRoom(r){
  const cfg=S.config[r]||{gabs:7,lvls:4,dsp:10};const ng=cfg.gabs||7,nl=cfg.lvls||4;
  let ts=0,us=0,fl=0;
  for(let g=1;g<=ng;g++){const s=gstat(r,g);ts+=s.ts;us+=s.us;if(s.p>=1)fl++;}
  const rn=r==='hab1'?'Habitación 1':'Habitación 2';
  const pals=S.pallets[r]||[];
  return`
  <div class="ph"><div><div class="phtitle">${rn}</div>
  <div class="phsub">${ng} gabinetes · ${nl} niveles c/u · ${ts} espacios totales</div></div>
  <div class="brow">
    <button class="btn btnxs" onclick="oPallet('${r}')"><i class="ti ti-plus" aria-hidden="true"></i> Pallet</button>
    <button class="btn btnp btnxs" onclick="oCfg('${r}')"><i class="ti ti-settings" aria-hidden="true"></i></button>
  </div></div>
  <div class="stats">
    <div class="stat"><div class="stn">${ts}</div><div class="stl">Total espacios</div></div>
    <div class="stat"><div class="stn" style="color:#1E7040">${ts-us}</div><div class="stl">Disponibles</div></div>
    <div class="stat"><div class="stn" style="color:#F5A800">${us}</div><div class="stl">Ocupados</div></div>
    <div class="stat"><div class="stn" style="color:#CC2200">${fl}</div><div class="stl">Gab. llenos</div></div>
  </div>
  <div class="stitle">Gabinetes — ${rn}</div>
  <div class="ggrid">
    ${Array.from({length:ng},(_,i)=>{
      const g=i+1;const st=gstat(r,g);const bi=binfo(st.p);
      return`<div class="gc" onclick="oGab('${r}',${g})">
        <div class="gch"><span class="gcn">Gab. ${g}</span><span class="bdg ${bi.c}">${bi.t}</span></div>
        ${Array.from({length:nl},(_,li)=>{
          const l=li+1;const sp=gls(r,g,l);const us=glu(r,g,l);const p=sp>0?us/sp:0;
          return`<div class="glv"><span class="glvl">N${l}</span><div class="glvb"><div class="glvf" style="width:${Math.min(100,Math.round(p*100))}%;background:${lvc(p)}"></div></div><span class="glvp">${us}/${sp}</span></div>`;
        }).join('')}
      </div>`;
    }).join('')}
  </div>
  ${pals.length>0?`<div class="stitle" style="margin-top:4px">Pallets en ${rn}</div>
  ${pals.map((p,pi)=>`<div class="palz">
    <div class="palzh"><span>📦 Pallet ${pi+1}: ${p.lbl}</span>
    <div class="brow"><button class="btn btnxs" onclick="oAddZI('${r}-p-${p.id}','${p.lbl}')"><i class="ti ti-plus" aria-hidden="true"></i></button><button class="btn btnxs btnd" onclick="dPallet('${r}','${p.id}')"><i class="ti ti-trash" aria-hidden="true"></i></button></div></div>
    ${(p.items||[]).length===0?'<div style="font-size:11px;color:var(--amb-tx);opacity:.8">Sin ítems</div>':
      (p.items||[]).map((it,j)=>`<div class="zi" style="background:rgba(255,248,230,0.4)">
        <span class="ziic">${iti(it.type).ic}</span>
        <div class="zii"><div class="zin">${it.desc}</div>
        <div style="font-size:10px;color:var(--txm)">${it.qty} ${it.unit}${it.proj?' · <b>'+it.proj+'</b>':''}${it.llegada?' · Llegó: '+fdShort(it.llegada):''}</div></div>
        <div class="brow"><button class="btn btnxs" onclick="oEditZI('${r}-p-${p.id}',${j})"><i class="ti ti-edit" aria-hidden="true"></i></button><button class="btn btnxs btnd" onclick="dZI('${r}-p-${p.id}',${j})"><i class="ti ti-trash" aria-hidden="true"></i></button></div>
      </div>`).join('')}
  </div>`).join('')}`:''}`;
}

  return`

  <div class="stats" style="grid-template-columns:repeat(3,1fr)">
    <div class="stat"><div class="stn">${items.length}</div><div class="stl">Ítems</div></div>

      ${it.notes?`<div style="font-size:10px;color:var(--txm);font-style:italic">${it.notes}</div>`:''}

    </div>`).join('')}`;

function rAg(){
  const q=searches.agenda;
  let ag=[...S.agenda].sort((a,b)=>a.date.localeCompare(b.date));
  if(q)ag=ag.filter(a=>[a.material,a.supplier,a.proj,a.oc,a.notes].filter(Boolean).join(' ').toLowerCase().split(' ').some(()=>q.toLowerCase().trim().split(/\s+/).every(w=>[a.material,a.supplier,a.proj,a.oc,a.notes].filter(Boolean).join(' ').toLowerCase().includes(w))));
  const pend=ag.filter(a=>a.status!=='received'),recv=ag.filter(a=>a.status==='received');
  return`
  <div class="ph"><div><div class="phtitle">Agenda de entregas</div><div class="phsub">Fechas aproximadas de recepción de material</div></div>
  <button class="btn btnp" onclick="oAddAg()"><i class="ti ti-plus" aria-hidden="true"></i> Nueva entrega</button></div>
  ${!ag.length&&q?`<div class="nodata"><i class="ti ti-search-off" aria-hidden="true"></i>Sin resultados</div>`:!ag.length?'<div class="nodata"><i class="ti ti-calendar-off" aria-hidden="true"></i>Sin entregas registradas</div>':''}
  ${pend.length?`<div class="stitle">Pendientes (${pend.length})</div>${pend.map(a=>rAgI(a,q)).join('')}`:''}
  ${recv.length?`<div class="stitle" style="margin-top:14px">Recibidas (${recv.length})</div>${recv.map(a=>rAgI(a,q)).join('')}`:''}`;
}
function rAgI(a,q){
  const d=fdate(a.date);
  const sc={pending:'bpend',received:'brecv',delayed:'bdel'}[a.status]||'bpend';
  const st={pending:'Pendiente',received:'Recibido',delayed:'Con retraso'}[a.status]||'Pendiente';
  return`<div class="agi">
    <div class="agd"><div class="agday">${d.day}</div><div class="agmon">${d.mon}</div></div>
    <div style="flex:1;min-width:0">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:6px">
        <div class="agttl">${hl(a.material,q)}</div><span class="bdg ${sc}" style="flex-shrink:0">${st}</span>
      </div>
      <div class="agmeta">${a.supplier?'<i class="ti ti-truck" aria-hidden="true" style="font-size:10px;vertical-align:-1px"></i> '+hl(a.supplier,q)+' · ':''}${a.proj?hl(a.proj,q)+' · ':''}${a.oc?'OC: '+hl(a.oc,q):''}</div>
      ${a.notes?`<div class="agmeta" style="font-style:italic">${hl(a.notes,q)}</div>`:''}
    </div>
    <div class="brow"><button class="btn btnxs" onclick="oEditAg('${a.id}')"><i class="ti ti-edit" aria-hidden="true"></i></button><button class="btn btnxs btnd" onclick="dAg('${a.id}')"><i class="ti ti-trash" aria-hidden="true"></i></button></div>
  </div>`;
}

function rDocs(){
  const q=searches.docs;
  let docs=[...S.docs];
  if(q)docs=docs.filter(d=>[d.name,d.by,d.proj,d.zone,d.notes].filter(Boolean).join(' ').toLowerCase().split(' ').filter(()=>q.toLowerCase().trim().split(/\s+/).every(w=>[d.name,d.by,d.proj,d.zone,d.notes].filter(Boolean).join(' ').toLowerCase().includes(w))).length>0||q.toLowerCase().trim().split(/\s+/).every(w=>[d.name,d.by,d.proj,d.zone,d.notes].filter(Boolean).join(' ').toLowerCase().includes(w)));
  return`
  <div class="ph"><div><div class="phtitle">Documentos</div><div class="phsub">Informes y registros de almacenamiento</div></div>
  <button class="btn btnp" onclick="oUpDoc()"><i class="ti ti-upload" aria-hidden="true"></i> Subir doc.</button></div>
  ${!docs.length&&q?`<div class="nodata"><i class="ti ti-search-off" aria-hidden="true"></i>Sin resultados</div>`:!docs.length?'<div class="nodata"><i class="ti ti-files" aria-hidden="true"></i>Sin documentos registrados</div>':
    docs.map(d=>{
      const ext=(d.name||'').split('.').pop().toLowerCase();
      const bg=ext==='pdf'?'#FCEAE8':ext==='docx'||ext==='doc'?'#D4E5FF':'#EEF2FA';
      const ic=ext==='pdf'?'📕':ext==='docx'||ext==='doc'?'📘':'📄';
      return`<div class="doci">
        <div class="docic" style="background:${bg}">${ic}</div>
        <div style="flex:1;min-width:0">
          <div class="docin">${hl(d.name,q)}</div>
          <div class="docim"><i class="ti ti-user" aria-hidden="true" style="font-size:10px;vertical-align:-1px"></i> ${hl(d.by,q)} · ${fd(d.at)}${d.proj?' · <b>'+hl(d.proj,q)+'</b>':''}</div>
          ${d.zone?`<div class="docim"><i class="ti ti-map-pin" aria-hidden="true" style="font-size:10px;vertical-align:-1px"></i> ${hl(d.zone,q)}</div>`:''}
          ${d.notes?`<div class="docim" style="font-style:italic">${hl(d.notes,q)}</div>`:''}
        </div>
        <div class="brow">${d.hasData&&d.fileId?`<button class="btn btnxs" onclick="dlDoc('${d.fileId}','${d.name}')"><i class="ti ti-download" aria-hidden="true"></i></button>`:''}
        <button class="btn btnxs btnd" onclick="dDoc('${d.id}')"><i class="ti ti-trash" aria-hidden="true"></i></button></div>
      </div>`;
    }).join('')}`;
}

function rLog(){
  const q=searches.registro;

  <div class="ph"><div><div class="phtitle">Registro de cambios</div><div class="phsub">Historial de actividad en COBOLCE BPG</div></div>

    `<div class="card">${logs.map(l=>`<div class="logr">

}

function rMover(){
  let cont='',lg='';
  if(modal.s==='usr')cont=mUsr();
  else if(modal.s==='gab'){cont=mGab();lg=' mlg';}
  else if(modal.s==='item')cont=mItem();
  else if(modal.s==='pal')cont=mPal();
  else if(modal.s==='ag')cont=mAg();
  else if(modal.s==='zi')cont=mZI();
  else if(modal.s==='doc')cont=mDoc();
  else if(modal.s==='cfg')cont=mCfg();
  return`<div class="mover" onclick="bgC(event)"><div class="modal${lg}" onclick="event.stopPropagation()">${cont}</div></div>`;

    <div class="fg"><label class="fl">Descripción del material</label><input class="fi" id="i-d" value="${item?.desc||''}" placeholder='Ej: Caja con Codos 90° 2" SCH80 HDG ASTM A234'></div>
    <div class="fr3">
      <div class="fg"><label class="fl">Cantidad</label><input class="fi" type="number" id="i-q" min="0" value="${item?.qty||1}"></div>
      <div class="fg"><label class="fl">Unidad</label><input class="fi" id="i-u" value="${item?.unit||'PZA'}" placeholder="PZA"></div>
      <div class="fg"><label class="fl">Espacios usados</label><input class="fi" type="number" id="i-s" min="1" max="${sp}" value="${item?.sp||1}"></div>
    </div>
    <div class="fr2">
      <div class="fg"><label class="fl">Proyecto / Asunto</label>${projInput('i-p',item?.proj)}</div>
      <div class="fg"><label class="fl">Ref. OC</label><input class="fi" id="i-o" value="${item?.oc||''}" placeholder="OC-2025-XXX"></div>
    </div>
    <div class="fr2">
      <div class="fg"><label class="fl">Fecha llegada al almacén</label><input type="date" class="fi" id="i-ll" value="${item?.llegada||''}"></div>
      <div class="fg"><label class="fl">Notas</label><input class="fi" id="i-n" value="${item?.notes||''}" placeholder="Observaciones..."></div>
    </div>
  </div>
  <div class="mfoot"><button class="btn" onclick="btG()">Cancelar</button><button class="btn btnp" onclick="svItem()"><i class="ti ti-check" aria-hidden="true"></i> Guardar</button></div>`;}
function mPal(){return`<div class="mhdr"><div class="mttl"><i class="ti ti-box" aria-hidden="true"></i> Nueva zona de pallet</div></div>
  <div class="mbody">
    <div class="fg"><label class="fl">Descripción del pallet</label><input class="fi" id="p-l" placeholder="Ej: Pallet con válvulas Hornos Fase 2"></div>
    <div class="fg"><label class="fl">Proyecto / Asunto</label>${projInput('p-p','')}</div>
  </div>
  <div class="mfoot"><button class="btn" onclick="cM()">Cancelar</button><button class="btn btnp" onclick="svPal()"><i class="ti ti-check" aria-hidden="true"></i> Agregar</button></div>`;}
function mAg(){
  const a=modal.d?.item;
  return`<div class="mhdr"><div class="mttl"><i class="ti ti-calendar-event" aria-hidden="true"></i> ${a?'Editar':'Nueva'} entrega programada</div></div>
  <div class="mbody">
    <div class="fr2">
      <div class="fg"><label class="fl">Fecha aproximada</label><input type="date" class="fi" id="a-dt" value="${a?.date||''}"></div>
      <div class="fg"><label class="fl">Estado</label><select class="fi" id="a-st">
        <option value="pending"${!a||a?.status==='pending'?' selected':''}>Pendiente</option>
        <option value="received"${a?.status==='received'?' selected':''}>Recibido</option>
        <option value="delayed"${a?.status==='delayed'?' selected':''}>Con retraso</option>
      </select></div>
    </div>
    <div class="fg"><label class="fl">Material / Descripción</label><input class="fi" id="a-m" value="${a?.material||''}" placeholder="Ej: Codos SCH80 HDG, tubería ASTM A106..."></div>
    <div class="fr2">
      <div class="fg"><label class="fl">Proveedor</label><input class="fi" id="a-s" value="${a?.supplier||''}" placeholder="Servipetrol, JN Importaciones..."></div>
      <div class="fg"><label class="fl">Proyecto / Asunto</label>${projInput('a-p',a?.proj)}</div>
    </div>
    <div class="fg"><label class="fl">Ref. OC</label><input class="fi" id="a-o" value="${a?.oc||''}" placeholder="OC-2025-XXX"></div>
    <div class="fg"><label class="fl">Notas</label><input class="fi" id="a-n" value="${a?.notes||''}" placeholder="Observaciones, contacto proveedor..."></div>
  </div>
  <div class="mfoot"><button class="btn" onclick="cM()">Cancelar</button><button class="btn btnp" onclick="svAg()"><i class="ti ti-check" aria-hidden="true"></i> Guardar</button></div>`;}
function mZI(){
  const{zid,zlbl,ei,item}=modal.d;
  return`<div class="mhdr"><div class="mttl">${ei!==undefined?'Editar':'Agregar'} material — ${zlbl}</div></div>
  <div class="mbody">
    <div class="fg"><label class="fl">Tipo</label><select class="fi" id="z-t">${ITYPES.map(t=>`<option value="${t.id}"${item?.type===t.id?' selected':''}>${t.ic} ${t.l}</option>`).join('')}</select></div>
    <div class="fg"><label class="fl">Descripción</label><input class="fi" id="z-d" value="${item?.desc||''}" placeholder='Ej: Bobina cable 4AWG, Tubo conduit 1"...'></div>
    <div class="fr2"><div class="fg"><label class="fl">Cantidad</label><input class="fi" type="number" id="z-q" min="0" value="${item?.qty||1}"></div>
    <div class="fg"><label class="fl">Unidad</label><input class="fi" id="z-u" value="${item?.unit||'PZA'}" placeholder="PZA / M / KG"></div></div>
    <div class="fr2"><div class="fg"><label class="fl">Proyecto / Asunto</label>${projInput('z-p',item?.proj)}</div>
    <div class="fg"><label class="fl">Ref. OC</label><input class="fi" id="z-o" value="${item?.oc||''}" placeholder="OC-2025-XXX"></div></div>
    <div class="fr2">
      <div class="fg"><label class="fl">Fecha llegada al almacén</label><input type="date" class="fi" id="z-ll" value="${item?.llegada||''}"></div>
      <div class="fg"><label class="fl">Notas</label><input class="fi" id="z-n" value="${item?.notes||''}" placeholder="Observaciones..."></div>
    </div>
  </div>
  <div class="mfoot"><button class="btn" onclick="cM()">Cancelar</button><button class="btn btnp" onclick="svZI()"><i class="ti ti-check" aria-hidden="true"></i> Guardar</button></div>`;}
function mDoc(){
  return`<div class="mhdr"><div class="mttl"><i class="ti ti-upload" aria-hidden="true"></i> Registrar documento</div></div>
  <div class="mbody">
    <div class="fg"><label class="fl">Archivo (PDF, Word, Excel — hasta 10MB)</label>
      <div class="upbox" id="ub" onclick="document.getElementById('fi').click()">
        <i class="ti ti-file-upload" aria-hidden="true" style="font-size:22px;display:block;margin-bottom:5px;color:var(--txm)"></i>
        <div style="font-size:12px;color:var(--txm)" id="ul">Haz clic para seleccionar un archivo</div>
      </div>
      <input type="file" id="fi" style="display:none" accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,.png,.jpg" onchange="hFile(event)">
    </div>
    <div class="fr2">
      <div class="fg"><label class="fl">Operario / Subido por</label><input class="fi" id="d-b" value="${S.user||''}" placeholder="Tu nombre"></div>
      <div class="fg"><label class="fl">Proyecto / Asunto</label>${projInput('d-p','')}</div>
    </div>
    <div class="fg"><label class="fl">Zona / Referencia</label><input class="fi" id="d-z" placeholder="Ej: Hab. 1 Gab. 3, Caseta..."></div>
    <div class="fg"><label class="fl">Descripción / Notas</label><input class="fi" id="d-n" placeholder="Ej: Informe de recepción tubería ASTM A106"></div>
  </div>
  <div class="mfoot"><button class="btn" onclick="cM()">Cancelar</button><button class="btn btnp" onclick="svDoc()"><i class="ti ti-check" aria-hidden="true"></i> Registrar</button></div>`;}
function mCfg(){
  const{r}=modal.d;const cfg=S.config[r]||{gabs:7,lvls:4,dsp:10};const rn=r==='hab1'?'Habitación 1':'Habitación 2';
  return`<div class="mhdr"><div class="mttl"><i class="ti ti-settings" aria-hidden="true"></i> Configurar ${rn}</div><button class="btn btnxs" onclick="cM()"><i class="ti ti-x" aria-hidden="true"></i></button></div>
  <div class="mbody">
    <div class="fr2">
      <div class="fg"><label class="fl">Número de gabinetes</label><input class="fi" type="number" id="c-g" min="1" max="20" value="${cfg.gabs||7}"></div>
      <div class="fg"><label class="fl">Niveles por gabinete</label><input class="fi" type="number" id="c-l" min="1" max="8" value="${cfg.lvls||4}"></div>
    </div>
    <div class="fg"><label class="fl">Espacios predeterminados por nivel</label><input class="fi" type="number" id="c-s" min="1" max="200" value="${cfg.dsp||10}">
    <div style="font-size:10px;color:var(--txm);margin-top:4px">Se aplica a posiciones nuevas.</div></div>
  </div>
  <div class="mfoot"><button class="btn" onclick="cM()">Cancelar</button><button class="btn btnp" onclick="svCfg()"><i class="ti ti-check" aria-hidden="true"></i> Guardar</button></div>`;}

/* === ACTIONS === */
function setTab(t){S.tab=t;render();}
function setRoom(r){S.room=r;render();}
function setSearch(v){searches[S.tab]=v;render();}
function clearSearch(){searches[S.tab]='';render();}
function bgC(e){if(modal?.s!=='usr')cM();}
function cM(){modal=null;render();}
function showUsr(){modal={s:'usr',d:{}};render();}
function svUsr(){
  const n=document.getElementById('u-n')?.value?.trim();
  if(!n){tst('Ingresa tu nombre');return;}
  S.user=n;localStorage.setItem('cobolce-user',n);modal=null;render();tst('Identificado como '+n);
}
function toggleDark(){
  S.dark=!S.dark;localStorage.setItem('cobolce-dark',S.dark);
  document.body.classList.toggle('dark',S.dark);render();
}
function oGab(r,g){modal={s:'gab',d:{r,g}};render();}
function btG(){const{r,g}=modal.d;modal={s:'gab',d:{r,g}};render();}
function oItem(r,g,l){modal={s:'item',d:{r,g,l}};render();}
function oEditItem(r,g,l,i){const item=gld(r,g,l).items[i];modal={s:'item',d:{r,g,l,ei:i,item:{...item}}};render();}
function svItem(){
  if(!S.user){tst('Identifícate primero');showUsr();return;}
  const{r,g,l,ei}=modal.d;
  const desc=document.getElementById('i-d')?.value?.trim();
  if(!desc){tst('Ingresa una descripción');return;}
  const it={id:uid(),type:document.getElementById('i-t')?.value||'box',desc,
    qty:+document.getElementById('i-q')?.value||1,unit:document.getElementById('i-u')?.value?.trim()||'PZA',
    sp:Math.max(1,+document.getElementById('i-s')?.value||1),
    proj:document.getElementById('i-p')?.value?.trim()||'',
    oc:document.getElementById('i-o')?.value?.trim()||'',
    llegada:document.getElementById('i-ll')?.value||'',
    notes:document.getElementById('i-n')?.value?.trim()||'',
    by:S.user,at:new Date().toISOString()};
  const ld=gld(r,g,l);
  if(ei!==undefined){it.id=ld.items[ei].id;it.by=ld.items[ei].by;it.at=ld.items[ei].at;ld.items[ei]=it;}
  else ld.items.push(it);
  alog(`Material ${ei!==undefined?'editado':'agregado'} — Gab. ${g} N${l}`,`${it.desc}${it.proj?' · '+it.proj:''}${it.llegada?' · Llegó: '+fdShort(it.llegada):''}`);
  modal={s:'gab',d:{r,g}};sv(['pos','log']);render();tst(ei!==undefined?'Material actualizado':'Material agregado');
}
function dItem(r,g,l,i){
  if(!confirm('¿Eliminar este material?'))return;
  const ld=gld(r,g,l);const n=ld.items[i]?.desc;ld.items.splice(i,1);
  alog(`Material eliminado — Gab. ${g} N${l}`,n);modal={s:'gab',d:{r,g}};sv(['pos','log']);render();tst('Material eliminado');
}
function eSp(r,g,l,cur){
  const v=prompt(`Espacios en Gab. ${g} Nivel ${l} (actual: ${cur}):`,cur);
  if(v===null)return;const n=Math.max(1,parseInt(v)||10);
  gld(r,g,l).sp=n;alog(`Espacios actualizados — Gab. ${g} N${l}`,`${n} espacios`);
  modal={s:'gab',d:{r,g}};sv(['pos','log']);render();
}
function oPallet(r){modal={s:'pal',d:{r}};render();}
function svPal(){
  if(!S.user){tst('Identifícate primero');return;}
  const lbl=document.getElementById('p-l')?.value?.trim();
  if(!lbl){tst('Ingresa una descripción');return;}
  if(!S.pallets[modal.d.r])S.pallets[modal.d.r]=[];
  S.pallets[modal.d.r].push({id:uid(),lbl,proj:document.getElementById('p-p')?.value?.trim()||'',items:[],by:S.user,at:new Date().toISOString()});
  alog('Pallet agregado',`${lbl}`);sv(['pal','log']);modal=null;render();tst('Pallet agregado');
}
function dPallet(r,pid){
  if(!confirm('¿Eliminar pallet y su contenido?'))return;
  const idx=S.pallets[r].findIndex(p=>p.id===pid);
  if(idx>=0){alog('Pallet eliminado',S.pallets[r][idx].lbl);S.pallets[r].splice(idx,1);}
  sv(['pal','log']);render();tst('Pallet eliminado');
}
function getZList(zid){
  if(zid==='caseta'||zid==='intemperie')return S.zoneItems[zid];
  const pts=zid.split('-');return S.pallets[pts[0]]?.find(p=>p.id===pts[2])?.items||[];
}
function oAddZI(zid,zlbl){modal={s:'zi',d:{zid,zlbl}};render();}
function oEditZI(zid,i){const items=getZList(zid);const item=items[i];const zlbl=zid==='caseta'?'Caseta':zid==='intemperie'?'Intemperie':'Pallet';modal={s:'zi',d:{zid,zlbl,ei:i,item:{...item}}};render();}
function svZI(){
  if(!S.user){tst('Identifícate primero');return;}
  const{zid,ei}=modal.d;const desc=document.getElementById('z-d')?.value?.trim();
  if(!desc){tst('Ingresa una descripción');return;}
  const it={id:uid(),type:document.getElementById('z-t')?.value||'box',desc,
    qty:+document.getElementById('z-q')?.value||1,unit:document.getElementById('z-u')?.value?.trim()||'PZA',
    proj:document.getElementById('z-p')?.value?.trim()||'',oc:document.getElementById('z-o')?.value?.trim()||'',
    llegada:document.getElementById('z-ll')?.value||'',notes:document.getElementById('z-n')?.value?.trim()||'',
    by:S.user,at:new Date().toISOString()};
  const list=getZList(zid);
  if(ei!==undefined){it.id=list[ei].id;it.by=list[ei].by;it.at=list[ei].at;list[ei]=it;}else list.push(it);
  const zone=zid==='caseta'?'Caseta':zid==='intemperie'?'Intemperie':'Pallet';
  alog(`Material ${ei!==undefined?'editado':'agregado'} — ${zone}`,desc);
  sv(zid==='caseta'||zid==='intemperie'?['zi','log']:['pal','log']);modal=null;render();tst('Material guardado');
}
function dZI(zid,i){
  if(!confirm('¿Eliminar este material?'))return;
  const list=getZList(zid);const n=list[i]?.desc;list.splice(i,1);
  const zone=zid==='caseta'?'Caseta':zid==='intemperie'?'Intemperie':'Pallet';
  alog(`Material eliminado — ${zone}`,n);sv(zid==='caseta'||zid==='intemperie'?['zi','log']:['pal','log']);render();tst('Material eliminado');
}
function oAddAg(){modal={s:'ag',d:{}};render();}
function oEditAg(id){const item=S.agenda.find(a=>a.id===id);modal={s:'ag',d:{item:{...item}}};render();}
function svAg(){
  if(!S.user){tst('Identifícate primero');return;}
  const date=document.getElementById('a-dt')?.value;const mat=document.getElementById('a-m')?.value?.trim();
  if(!date||!mat){tst('Completa fecha y descripción');return;}
  const en={id:uid(),date,material:mat,
    supplier:document.getElementById('a-s')?.value?.trim()||'',proj:document.getElementById('a-p')?.value?.trim()||'',
    oc:document.getElementById('a-o')?.value?.trim()||'',notes:document.getElementById('a-n')?.value?.trim()||'',
    status:document.getElementById('a-st')?.value||'pending',by:S.user,at:new Date().toISOString()};
  const ei=modal.d?.item;
  if(ei){const idx=S.agenda.findIndex(a=>a.id===ei.id);if(idx>=0){en.id=ei.id;en.by=ei.by;en.at=ei.at;S.agenda[idx]=en;}}
  else S.agenda.push(en);
  alog(ei?'Entrega actualizada':'Entrega registrada en agenda',mat);sv(['ag','log']);modal=null;render();tst('Entrega guardada');
}
function dAg(id){
  if(!confirm('¿Eliminar esta entrega?'))return;
  const a=S.agenda.find(x=>x.id===id);S.agenda=S.agenda.filter(x=>x.id!==id);
  alog('Entrega eliminada',a?.material||'');sv(['ag','log']);render();tst('Entrega eliminada');
}
function oUpDoc(){pFile=null;modal={s:'doc',d:{}};render();}
function hFile(e){
  const file=e.target.files[0];if(!file)return;
  pFile={file,name:file.name,size:file.size};
  const ul=document.getElementById('ul');if(ul)ul.textContent=`✓ ${file.name} (${(file.size/1024).toFixed(0)} KB)`;
  const ub=document.getElementById('ub');if(ub)ub.style.borderColor='#F5A800';
}
async function svDoc(){
  const by=document.getElementById('d-b')?.value?.trim()||S.user||'Anónimo';
  const notes=document.getElementById('d-n')?.value?.trim()||'';
  let fileId=null,fileName=null;
  if(pFile?.file){
    tst('Subiendo archivo...');
    try{
      const fd=new FormData();fd.append('archivo',pFile.file,pFile.name);
      const r=await fetch('/api/archivos',{method:'POST',body:fd});
      const result=await r.json();
      if(result.id){fileId=result.id;fileName=result.nombre;}
    }catch(e){tst('Error al subir archivo');}
  }
  const name=fileName||pFile?.name||(notes||'Documento sin archivo');
  const doc={id:uid(),name,by,at:new Date().toISOString(),
    proj:document.getElementById('d-p')?.value?.trim()||'',
    zone:document.getElementById('d-z')?.value?.trim()||'',
    notes,hasData:!!fileId,fileId};
  S.docs.unshift(doc);alog('Documento registrado',`${name} · por ${by}`);
  sv(['docs','log']);pFile=null;modal=null;render();tst('Documento registrado');
}
function dlDoc(fileId,nombre){
  const a=document.createElement('a');a.href=`/api/archivos/${fileId}`;a.download=nombre;a.click();
}
function dDoc(id){
  if(!confirm('¿Eliminar este documento?'))return;
  const doc=S.docs.find(d=>d.id===id);S.docs=S.docs.filter(d=>d.id!==id);
  if(doc?.fileId)fetch(`/api/archivos/${doc.fileId}`,{method:'DELETE'}).catch(()=>{});
  alog('Documento eliminado',doc?.name||'');sv(['docs','log']);render();tst('Documento eliminado');
}
function oCfg(r){modal={s:'cfg',d:{r}};render();}
function svCfg(){
  const{r}=modal.d;if(!S.config[r])S.config[r]={};
  S.config[r].gabs=Math.max(1,+document.getElementById('c-g')?.value||7);
  S.config[r].lvls=Math.max(1,+document.getElementById('c-l')?.value||4);
  S.config[r].dsp=Math.max(1,+document.getElementById('c-s')?.value||10);
  alog('Configuración actualizada',`${r==='hab1'?'Hab. 1':'Hab. 2'}: ${S.config[r].gabs} gabinetes`);
  sv(['cfg','log']);modal=null;render();tst('Configuración guardada');
}
function clrLog(){if(!confirm('¿Limpiar registro?'))return;S.changelog=[];sv(['log']);render();tst('Registro limpiado');}
function tst(msg){
  toastMsg=msg;clearTimeout(toastTmr);render();
  toastTmr=setTimeout(()=>{toastMsg='';render();},3000);
}
async function poll(){
  try{
    const r=await fetch('/api/lastmod');const d=await r.json();
    if(d.lm>localLM){await loadAll();render();}
  }catch(e){}
}
async function init(){
  await loadAll();
  if(!S.user)modal={s:'usr',d:{}};
  render();setInterval(poll,20000);
}
init();
</script>
</body>
</html>
