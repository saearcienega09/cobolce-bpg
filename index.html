<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COBOLCE — Almacén Virtual BPG</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>


*{box-sizing:border-box;margin:0;padding:0}
:root{--n:#1B3A6B;--nl:#2A5BA0;--nd:#0F2347;--g:#F5A800;--gl:#FFCA3A;--r:#CC2200;--bg:#EEF2FA;--bg2:#E2E9F4;--card:#fff;--bdr:#D0D9E8;--bdr2:#B8C7E0;--tx:#1B3A6B;--txm:#5A6E8A;--txl:#9AAABB;--grn-bg:#E6F4EC;--grn-tx:#145230;--amb-bg:#FFF8E6;--amb-tx:#7A4F00;--red-bg:#FCEAE8;--red-tx:#7A1A0E;--rad:8px;--radl:10px;--rads:5px;}
body.dark{--bg:#0B1525;--bg2:#0F1C30;--card:#152238;--bdr:#243550;--bdr2:#2E4266;--tx:#C8D9F0;--txm:#7B96B8;--txl:#4A6080;--grn-bg:#0D2E1A;--grn-tx:#6DD69A;--amb-bg:#2A1F00;--amb-tx:#FFB938;--red-bg:#2A0B08;--red-tx:#FF8070;}
html{min-height:100%;background:var(--bg)}body{min-height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif;font-size:13px;line-height:1.4}
.app{min-height:100vh;display:flex;flex-direction:column;position:relative}
.hdr{background:var(--n);color:#fff;padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:50px;flex-shrink:0}
.hbrand{display:flex;align-items:center;gap:10px}
.htitle b{color:var(--g);font-size:13px;display:block;font-weight:500}
.htitle{font-size:11px;color:rgba(255,255,255,.8);line-height:1.3}
.hsep{width:1px;height:26px;background:rgba(255,255,255,.2)}
.hright{display:flex;align-items:center;gap:7px}
.ibtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:4px 11px;color:rgba(255,255,255,.88);font-size:11px;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:inherit;transition:background .12s}
.ibtn:hover{background:rgba(255,255,255,.22)}
.sync{font-size:10px;color:rgba(255,255,255,.4);display:flex;align-items:center;gap:4px}
.sdot{width:5px;height:5px;border-radius:50%;background:#4CAF50;flex-shrink:0}
.tabs{background:var(--nd);display:flex;padding:0 16px;border-bottom:2px solid var(--g);overflow-x:auto;flex-shrink:0}
.tab{padding:9px 13px;font-size:12px;font-weight:500;color:rgba(255,255,255,.5);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:5px;white-space:nowrap;transition:color .12s}
.tab i{font-size:12px}
.tab:hover{color:rgba(255,255,255,.85)}
.tab.act{color:var(--g);border-bottom-color:var(--g)}
.tbanner{background:var(--n);color:#fff;padding:6px 16px;font-size:12px;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;border-bottom:2px solid var(--g);flex-shrink:0}
.searchbar{padding:10px 18px;background:var(--bg2);border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:8px;flex-shrink:0}
.srch{flex:1;border:1px solid var(--bdr2);border-radius:99px;padding:5px 12px;font-size:12px;background:var(--card);color:var(--tx);font-family:inherit;outline:none}
.srch:focus{border-color:var(--nl)}
.clrbtn{background:none;border:none;cursor:pointer;color:var(--txm);font-size:14px;padding:2px;display:flex;align-items:center}
.body{flex:1;display:flex;min-height:0}
.sb{width:150px;background:var(--card);border-right:1px solid var(--bdr);flex-shrink:0;padding:10px 0;overflow-y:auto}
.sblbl{font-size:9px;font-weight:500;color:var(--txl);letter-spacing:.09em;text-transform:uppercase;padding:0 14px;margin:10px 0 5px}
.sbi{padding:7px 12px;cursor:pointer;font-size:12px;color:var(--txm);display:flex;align-items:flex-start;gap:7px;border-left:2px solid transparent;transition:all .12s}
.sbi i{font-size:13px;margin-top:1px;flex-shrink:0}
.sbi:hover{background:var(--bg);color:var(--tx)}
.sbi.act{background:var(--bg);color:var(--n);font-weight:500;border-left-color:var(--g)}
.sbsub{font-size:10px;color:var(--txl);margin-top:1px}
.main{flex:1;overflow-y:auto;padding:16px 18px;background:var(--bg)}
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:13px;gap:8px}
.phtitle{font-size:14px;font-weight:500;color:var(--n)}
body.dark .phtitle{color:var(--tx)}
.phsub{font-size:11px;color:var(--txm);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bdr);border-radius:var(--rad);padding:9px 10px;text-align:center}
.stn{font-size:20px;font-weight:500;color:var(--n)}
body.dark .stn{color:var(--tx)}
.stl{font-size:9px;color:var(--txm);text-transform:uppercase;letter-spacing:.05em;margin-top:1px}
.stitle{font-size:10px;font-weight:500;color:var(--txm);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:8px;margin-bottom:12px}
.gc{background:var(--card);border:1px solid var(--bdr);border-radius:var(--rad);padding:9px;cursor:pointer;transition:border-color .13s,transform .12s}
.gc:hover{border-color:var(--nl);transform:translateY(-1px)}
.gch{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.gcn{font-size:10px;font-weight:500;color:var(--txm)}
.glv{display:flex;align-items:center;gap:4px;margin-bottom:3px}
.glvl{font-size:9px;color:var(--txl);width:13px;flex-shrink:0}
.glvb{flex:1;height:4px;background:var(--bg2);border-radius:2px;overflow:hidden}
.glvf{height:100%;border-radius:2px}
.glvp{font-size:9px;color:var(--txm);width:25px;text-align:right;flex-shrink:0}
.bdg{font-size:9px;padding:1px 5px;border-radius:99px;font-weight:500}
.bok{background:var(--grn-bg);color:var(--grn-tx)}.bmid{background:var(--amb-bg);color:var(--amb-tx)}.bfull{background:var(--red-bg);color:var(--red-tx)}.bemp{background:var(--bg2);color:var(--txm)}.bpend{background:var(--amb-bg);color:var(--amb-tx)}.brecv{background:var(--grn-bg);color:var(--grn-tx)}.bdel{background:var(--red-bg);color:var(--red-tx)}
.palz{background:var(--amb-bg);border:1px solid #E8D09A;border-radius:var(--rad);padding:10px 12px;margin-bottom:8px}
body.dark .palz{border-color:#4A3800}
.palzh{font-size:11px;font-weight:500;color:var(--amb-tx);margin-bottom:7px;display:flex;align-items:center;justify-content:space-between}
.zi{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:var(--card);border:1px solid var(--bdr);border-radius:var(--rad);margin-bottom:5px}
.ziic{font-size:15px;flex-shrink:0;margin-top:1px}.zii{flex:1;min-width:0}.zin{font-size:11px;font-weight:500;color:var(--tx)}.zim{font-size:10px;color:var(--txm);margin-top:1px}
.agi{background:var(--card);border:1px solid var(--bdr);border-radius:var(--rad);padding:10px 12px;margin-bottom:7px;display:flex;align-items:flex-start;gap:10px}
.agd{background:var(--n);color:#fff;border-radius:6px;padding:4px 7px;text-align:center;flex-shrink:0;min-width:40px}
.agday{font-size:17px;font-weight:500;line-height:1}.agmon{font-size:8px;text-transform:uppercase;letter-spacing:.05em;opacity:.8}
.agttl{font-size:12px;font-weight:500;color:var(--tx)}.agmeta{font-size:10px;color:var(--txm);margin-top:2px}
.doci{background:var(--card);border:1px solid var(--bdr);border-radius:var(--rad);padding:10px 12px;margin-bottom:7px;display:flex;align-items:center;gap:10px}
.docic{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.docin{font-size:12px;font-weight:500;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.docim{font-size:10px;color:var(--txm);margin-top:2px}
.logr{padding:8px 0;border-bottom:1px solid var(--bdr);display:flex;gap:10px}.logr:last-child{border-bottom:none}
.logd{width:7px;height:7px;border-radius:50%;background:var(--g);flex-shrink:0;margin-top:4px}.logt{font-size:11px;color:var(--tx)}.logm{font-size:10px;color:var(--txm);margin-top:2px}
.btn{padding:6px 11px;border-radius:var(--rad);border:1px solid var(--bdr2);background:var(--card);color:var(--tx);font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:inherit;white-space:nowrap;transition:all .1s}
.btn:hover{background:var(--bg);border-color:var(--n)}.btnp{background:var(--n);border-color:var(--n);color:#fff}.btnp:hover{background:var(--nl);border-color:var(--nl)}
.btnxs{padding:3px 8px;font-size:10px;border-radius:var(--rads)}.btnd{border-color:#E5C0BC;color:var(--r)}.btnd:hover{background:var(--red-bg);border-color:var(--r)}
.brow{display:flex;gap:4px;align-items:center;flex-shrink:0}
.card{background:var(--card);border-radius:var(--radl);border:1px solid var(--bdr);padding:14px}
.nodata{text-align:center;padding:30px 16px;color:var(--txm);font-size:12px}.nodata i{font-size:26px;display:block;margin-bottom:6px;color:var(--txl)}
.sres{background:var(--card);border:1px solid var(--bdr);border-radius:var(--rad);padding:9px 12px;margin-bottom:6px;display:flex;align-items:flex-start;gap:9px;transition:border-color .12s}.sres:hover{border-color:var(--nl)}
.mover{position:absolute;inset:0;background:rgba(5,12,30,.48);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:36px 16px 20px;overflow-y:auto}
.modal{background:var(--card);border-radius:12px;border:1px solid var(--bdr2);width:100%;max-width:460px;display:flex;flex-direction:column;max-height:90vh}
.mlg{max-width:600px}.mhdr{padding:12px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.mttl{font-size:13px;font-weight:500;color:var(--tx)}.mbody{padding:14px 16px;overflow-y:auto;flex:1}.mfoot{padding:10px 16px;border-top:1px solid var(--bdr);display:flex;justify-content:flex-end;gap:7px;flex-shrink:0}
.fg{margin-bottom:10px}.fl{font-size:10px;font-weight:500;color:var(--txm);display:block;margin-bottom:3px}
.fi{width:100%;padding:7px 9px;border-radius:var(--rad);border:1px solid var(--bdr2);font-size:12px;color:var(--tx);background:var(--card);font-family:inherit;outline:none}.fi:focus{border-color:var(--nl)}
select.fi{cursor:pointer}.fr2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.lvblk{border:1px solid var(--bdr);border-radius:var(--rad);margin-bottom:8px;overflow:hidden}
.lvhdr{background:var(--bg2);padding:7px 11px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bdr)}
.lvhdrl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.lvname{font-size:12px;font-weight:500;color:var(--tx)}.lvsp{font-size:9px;padding:2px 7px;border-radius:99px;background:var(--card);border:1px solid var(--bdr);color:var(--txm)}.lvbody{padding:8px 11px}
.ic{display:flex;align-items:flex-start;gap:7px;padding:6px 8px;background:var(--bg2);border-radius:6px;margin-bottom:5px}
.icico{font-size:14px;flex-shrink:0;margin-top:1px}.icinfo{flex:1;min-width:0}.icn{font-size:11px;font-weight:500;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.icm{font-size:10px;color:var(--txm);margin-top:1px}.icp{font-size:9px;padding:1px 5px;border-radius:99px;background:var(--card);border:1px solid var(--bdr);color:var(--tx);display:inline-block;margin-top:2px}.icby{font-size:9px;color:var(--txl);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.upbox{border:2px dashed var(--bdr2);border-radius:var(--rad);padding:20px;text-align:center;cursor:pointer;transition:border-color .15s}.upbox:hover{border-color:var(--nl)}
mark{background:rgba(245,168,0,.3);color:inherit;border-radius:2px;padding:0 1px}
/* NUEVOS */
.disc-nav{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap}
.disc-btn{padding:5px 13px;border-radius:99px;border:1px solid var(--bdr2);background:var(--card);color:var(--txm);font-size:11px;cursor:pointer;font-family:inherit;transition:all .12s}
.disc-btn:hover{background:var(--bg);color:var(--tx)}.disc-btn.act{background:var(--n);border-color:var(--n);color:#fff}
.lista-wrap{background:var(--card);border-radius:var(--radl);border:1px solid var(--bdr);overflow:hidden;overflow-x:auto}
.lista-tbl{width:100%;border-collapse:collapse;min-width:600px}
.lista-tbl th{font-size:9px;font-weight:500;color:var(--txm);text-transform:uppercase;letter-spacing:.06em;padding:7px 10px;text-align:left;border-bottom:1px solid var(--bdr);white-space:nowrap;background:var(--bg2)}
.lista-tbl td{padding:8px 10px;border-bottom:1px solid var(--bdr);font-size:12px;vertical-align:middle}
.lista-tbl tbody tr:last-child td{border-bottom:none}.lista-tbl tbody tr.rg td{background:#EBF7F0}.lista-tbl tbody tr.ry td{background:#FEFAE8}
body.dark .lista-tbl tbody tr.rg td{background:#0D2E1A}body.dark .lista-tbl tbody tr.ry td{background:#2A1F00}
.lista-tbl tbody tr:hover{opacity:.9;cursor:pointer}
.cod{font-family:monospace;font-size:11px;font-weight:600;color:var(--n)}body.dark .cod{color:var(--g)}
.oc-card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--radl);padding:13px 15px;margin-bottom:8px}
.oc-hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.oc-num{font-size:13px;font-weight:600;color:var(--n);font-family:monospace}body.dark .oc-num{color:var(--tx)}
.oc-meta{font-size:10px;color:var(--txm);margin-top:3px}
.flow{display:flex;align-items:center;gap:3px;flex-wrap:wrap;margin-top:7px}
.fstep{font-size:9px;padding:2px 7px;border-radius:99px;border:1px solid var(--bdr);color:var(--txl);background:var(--card)}
.fstep.fdone{background:var(--grn-bg);border-color:var(--grn-tx);color:var(--grn-tx)}.fstep.fact{background:var(--n);border-color:var(--n);color:#fff;font-weight:500}
.farr{font-size:10px;color:var(--txl)}
.oc-mats{margin-top:9px;padding-top:9px;border-top:1px solid var(--bdr)}
.oc-mat{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:11px;color:var(--txm)}
.prov-card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--radl);padding:13px 15px;margin-bottom:8px;display:flex;align-items:flex-start;gap:12px}
.prov-flag{font-size:22px;flex-shrink:0;margin-top:2px}.prov-info{flex:1;min-width:0}.prov-name{font-size:13px;font-weight:500;color:var(--tx)}.prov-meta{font-size:10px;color:var(--txm);margin-top:3px;display:flex;flex-wrap:wrap;gap:6px}
.calc-item{display:flex;align-items:center;gap:9px;padding:8px 11px;background:var(--card);border:1px solid var(--bdr);border-radius:var(--rad);margin-bottom:5px}
.calc-total{background:var(--n);color:#fff;border-radius:var(--rad);padding:14px 18px;margin-top:12px;display:flex;align-items:center;justify-content:space-between}
.calc-total-n{font-size:24px;font-weight:500}
.mat-cod{font-family:monospace;font-size:11px;font-weight:600;color:var(--n);flex-shrink:0;min-width:65px}
body.dark .mat-cod{color:var(--g)}


/* === EXPANSIÓN v3 === */
.sel-bar{position:fixed;bottom:0;left:0;right:0;background:var(--nd);padding:10px 16px;display:flex;align-items:center;gap:8px;z-index:150;border-top:2px solid var(--g);box-shadow:0 -4px 16px rgba(0,0,0,.3)}
.alert-banner{background:var(--amb-bg);border:1px solid #E8D09A;border-radius:var(--rad);padding:9px 12px;margin-bottom:12px;display:flex;align-items:center;gap:8px;cursor:pointer}
body.dark .alert-banner{border-color:#4A3800}
.tab-badge{display:inline-flex;align-items:center;justify-content:center;background:var(--r);color:#fff;border-radius:99px;font-size:9px;font-weight:500;min-width:14px;height:14px;padding:0 3px;margin-left:3px;line-height:1}
.cotiz-wrap{background:var(--card);border-radius:var(--radl);border:1px solid var(--bdr);overflow:hidden;overflow-x:auto;margin-bottom:10px}
.cotiz-tbl{width:100%;border-collapse:collapse;min-width:500px}
.cotiz-tbl th{font-size:9px;font-weight:500;color:var(--txm);text-transform:uppercase;letter-spacing:.06em;padding:7px 10px;text-align:left;border-bottom:1px solid var(--bdr);white-space:nowrap;background:var(--bg2)}
.cotiz-tbl td{padding:7px 10px;border-bottom:1px solid var(--bdr);font-size:12px;vertical-align:middle;border-right:1px solid var(--bdr)}
.cotiz-tbl td:last-child{border-right:none}
.cotiz-tbl tbody tr:last-child td{border-bottom:none}
.cotiz-tbl tbody tr:hover td{background:var(--bg2)}
.best-cell{background:#E6F4EC!important;font-weight:600;color:var(--grn-tx)}
body.dark .best-cell{background:#0D2E1A!important}
.price-input{width:80px;padding:4px 6px;border:1px solid var(--bdr2);border-radius:4px;font-size:11px;text-align:right;background:var(--card);color:var(--tx);font-family:monospace}
.price-input:focus{border-color:var(--nl);outline:none}
.cotiz-card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--radl);padding:12px 14px;margin-bottom:8px}
.rec-badge{font-size:9px;padding:1px 6px;border-radius:99px;font-weight:500;flex-shrink:0}
.rbcomplete{background:#E6F4EC;color:var(--grn-tx)}.rbpartial{background:#FFF8E6;color:var(--amb-tx)}.rbnone{background:var(--bg2);color:var(--txm)}
.dash-card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--radl);padding:14px;margin-bottom:10px}
.dash-disc-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--bdr)}
.dash-disc-row:last-child{border-bottom:none}
.disc-prog{flex:1;height:6px;background:var(--bg2);border-radius:3px;overflow:hidden}
.disc-progf{height:100%;border-radius:3px}
.proj-sel{border:1px solid var(--bdr2);border-radius:var(--rad);padding:6px 10px;font-size:12px;background:var(--card);color:var(--tx);font-family:inherit;outline:none;cursor:pointer}
.li-check{width:14px;height:14px;cursor:pointer;accent-color:var(--n);flex-shrink:0}
.lista-tbl td:first-child{width:26px;padding:8px 6px 8px 10px}
.lista-tbl th:first-child{width:26px;padding:7px 6px 7px 10px}
.check-all{width:14px;height:14px;cursor:pointer;accent-color:var(--n)}
.warehouse-loc{font-size:9px;padding:2px 7px;border-radius:99px;background:var(--n);color:#fff;display:inline-block;margin:1px 2px;font-family:monospace}
body.dark .warehouse-loc{background:var(--nl);color:#fff}


/* Dark mode: inputs, selects, textareas */
body.dark .fi{background:var(--bg2);border-color:var(--bdr2)}
body.dark .price-input{background:var(--bg2);color:var(--tx);border-color:var(--bdr2)}
body.dark input,body.dark select,body.dark textarea{color:var(--tx)}
body.dark input[type=number],body.dark input[type=date],body.dark input[type=text]{background:var(--bg2)}
/* Row: excedente (azul claro) */
.lista-tbl tbody tr.rbl td{background:#EAF0FF}
body.dark .lista-tbl tbody tr.rbl td{background:#0C1D3A}
/* Row: anulado (tachado + apagado) */
.lista-tbl tbody tr.ranu td{opacity:.42;text-decoration:line-through}
/* Sort/filter bars */
.sort-bar{display:flex;align-items:center;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.srt-btn{padding:4px 10px;border-radius:99px;border:1px solid var(--bdr2);background:var(--card);color:var(--txm);font-size:10px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:3px;transition:all .1s;white-space:nowrap}
.srt-btn:hover{background:var(--bg);color:var(--tx)}.srt-btn.act{background:var(--n);border-color:var(--n);color:#fff}
.filter-bar{display:flex;align-items:center;gap:5px;padding:8px 10px;background:var(--bg2);border-radius:var(--rad);border:1px solid var(--bdr);margin-bottom:10px;flex-wrap:wrap}
.fp{padding:3px 9px;border-radius:99px;border:1px solid var(--bdr2);background:var(--card);color:var(--txm);font-size:10px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .1s}
.fp:hover{opacity:.85}.fp.act{font-weight:500;border-width:1.5px}
.fp-all.act{background:var(--bg2);color:var(--tx);border-color:var(--bdr2)}
.fp-none.act{background:var(--red-bg);color:var(--red-tx);border-color:var(--red-tx)}
.fp-part.act{background:var(--amb-bg);color:var(--amb-tx);border-color:var(--amb-tx)}
.fp-full.act{background:var(--grn-bg);color:var(--grn-tx);border-color:var(--grn-tx)}
.fp-over.act{background:#EAF0FF;color:#1A3C7A;border-color:#5080C0}
body.dark .fp-over.act{background:#0C1D3A;color:#7EB3FF;border-color:#4070B0}
/* Estado badges en listas */
.eb{font-size:9px;padding:2px 7px;border-radius:99px;font-weight:500;white-space:nowrap;flex-shrink:0}
.eb-pend{background:var(--bg2);color:var(--txm)}
.eb-cot{background:#FFF0E0;color:#8B4500}body.dark .eb-cot{background:#2A1800;color:#FFB060}
.eb-oc{background:#E8EDFF;color:#2A3DA0}body.dark .eb-oc{background:#0A1535;color:#8AA0FF}
.eb-insp{background:var(--amb-bg);color:var(--amb-tx)}
.eb-tran{background:#E0F0FF;color:#1A5A8A}body.dark .eb-tran{background:#0A2035;color:#60B0FF}
.eb-adua{background:#F0E8FF;color:#5A1A8A}body.dark .eb-adua{background:#1A0A35;color:#B060FF}
.eb-recv{background:var(--grn-bg);color:var(--grn-tx)}
.eb-anul{background:#EBEBEB;color:#888}body.dark .eb-anul{background:#222;color:#666}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>


const ITYPES=[{id:'box',l:'Caja',ic:'📦'},{id:'pallet',l:'Pallet de material',ic:'🪵'},{id:'spool',l:'Bobina de cable',ic:'🔄'},{id:'tube',l:'Tubo / Conduit',ic:'📏'},{id:'bag',l:'Big Bag',ic:'🎒'},{id:'other',l:'Otro',ic:'📌'}];
const PROJ_HINTS=['Hornos Fase 1','Hornos Fase 2','APE GLP','General','EPP','Material BPG','Mantenimiento','Otro'];
const DISCIPLINAS=[{id:'civil',l:'Civil',ic:'🏗️'},{id:'electrica',l:'Eléctrica',ic:'⚡'},{id:'instrumentacion',l:'Inst. y Control',ic:'🎛️'},{id:'mecanica',l:'Mecánica',ic:'⚙️'}];
const OC_STATES=[{id:'cotizacion',l:'Cotización'},{id:'revision',l:'Rev. Técnica'},{id:'aprobada',l:'Aprobada'},{id:'enviada',l:'OC Enviada'},{id:'transito',l:'En Tránsito'},{id:'aduana',l:'En Aduana'},{id:'recibido',l:'Recibido'}];

const ITEM_ESTADOS=[
  {id:'pendiente',l:'Pendiente',cls:'eb-pend'},
  {id:'cotizacion',l:'En Cotización',cls:'eb-cot'},
  {id:'oc',l:'En Orden de Compra',cls:'eb-oc'},
  {id:'inspeccion',l:'En Inspección Técnica',cls:'eb-insp'},
  {id:'transito',l:'En Tránsito',cls:'eb-tran'},
  {id:'aduana',l:'En Aduana',cls:'eb-adua'},
  {id:'recibido',l:'Recibido en almacén',cls:'eb-recv'},
  {id:'anulado',l:'ANULADO',cls:'eb-anul'}
];
const PAISES=['Bolivia','Argentina','Chile','Perú','Brasil','EEUU','Paraguay','China','España','Colombia','Uruguay','Otro'];
const SK={pos:'cobolce-pos',zi:'cobolce-zi',pal:'cobolce-pal',ag:'cobolce-ag',docs:'cobolce-docs',log:'cobolce-log',cfg:'cobolce-cfg',listas:'cobolce-listas',ocs:'cobolce-ocs',provs:'cobolce-provs',cotiz:'cobolce-cotiz'};

let S={tab:'mapa',room:'hab1',disc:'civil',user:'',dark:false,
  positions:{},zoneItems:{caseta:[],intemperie:[],cotoca:[]},
  pallets:{hab1:[],hab2:[]},agenda:[],docs:[],changelog:[],
  config:{hab1:{gabs:7,lvls:4,dsp:10},hab2:{gabs:7,lvls:4,dsp:10}},
  listas:{civil:[],electrica:[],instrumentacion:[],mecanica:[]},
  ocs:[],proveedores:[],cotizaciones:[]};
let localLM=0,modal=null,toastMsg='',toastTmr=null,pFile=null,modalMats=[];
let calcItems=[];
let searches={mapa:'',agenda:'',docs:'',registro:'',listas:'',oc:'',proveedores:'',cotiz:''};

async function sg(k){try{const r=await fetch('/api/kv/'+encodeURIComponent(k));if(!r.ok)return null;const d=await r.json();return d?JSON.parse(d.value):null;}catch(e){return null;}}
async function ss(k,v){try{await fetch('/api/kv/'+encodeURIComponent(k),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({value:JSON.stringify(v)})});}catch(e){}}
async function loadAll(){
  S.positions=await sg(SK.pos)||{};
  const zi=await sg(SK.zi)||{caseta:[],intemperie:[],cotoca:[]};
  if(!zi.cotoca)zi.cotoca=[];S.zoneItems=zi;
  S.pallets=await sg(SK.pal)||{hab1:[],hab2:[]};
  S.agenda=await sg(SK.ag)||[];S.docs=await sg(SK.docs)||[];S.changelog=await sg(SK.log)||[];
  S.config=await sg(SK.cfg)||{hab1:{gabs:7,lvls:4,dsp:10},hab2:{gabs:7,lvls:4,dsp:10}};
  const ls=await sg(SK.listas)||{civil:[],electrica:[],instrumentacion:[],mecanica:[]};
  DISCIPLINAS.forEach(d=>{if(!ls[d.id])ls[d.id]=[];});S.listas=ls;
  S.ocs=await sg(SK.ocs)||[];S.proveedores=await sg(SK.provs)||[];S.cotizaciones=await sg(SK.cotiz)||[];
  S.user=localStorage.getItem('cobolce-user')||'';
  S.dark=localStorage.getItem('cobolce-dark')==='true';
  if(S.dark)document.body.classList.add('dark');
  try{const r=await fetch('/api/lastmod');const d=await r.json();localLM=d.lm||0;}catch(e){}
}
async function sv(keys){
  if(keys.includes('pos'))await ss(SK.pos,S.positions);
  if(keys.includes('zi'))await ss(SK.zi,S.zoneItems);
  if(keys.includes('pal'))await ss(SK.pal,S.pallets);
  if(keys.includes('ag'))await ss(SK.ag,S.agenda);
  if(keys.includes('docs'))await ss(SK.docs,S.docs);
  if(keys.includes('log'))await ss(SK.log,S.changelog);
  if(keys.includes('cfg'))await ss(SK.cfg,S.config);
  if(keys.includes('listas'))await ss(SK.listas,S.listas);
  if(keys.includes('ocs'))await ss(SK.ocs,S.ocs);
  if(keys.includes('provs'))await ss(SK.provs,S.proveedores);
  if(keys.includes('cotiz'))await ss(SK.cotiz,S.cotizaciones);
  localLM=Date.now();
}

function lk(r,g,l){return r+'-G'+g+'-N'+l;}
function gld(r,g,l){const k=lk(r,g,l);if(!S.positions[k])S.positions[k]={sp:S.config[r]?.dsp||10,items:[]};return S.positions[k];}
function gls(r,g,l){return gld(r,g,l).sp||10;}
function glu(r,g,l){return gld(r,g,l).items.reduce((a,i)=>a+(i.sp||1),0);}
function gstat(r,g){const lv=S.config[r]?.lvls||4;let ts=0,us=0;for(let l=1;l<=lv;l++){ts+=gls(r,g,l);us+=glu(r,g,l);}return{ts,us,p:ts>0?us/ts:0};}
function iti(t){return ITYPES.find(x=>x.id===t)||ITYPES[5];}
function lvc(p){return p>=1?'#CC2200':p>=.7?'#F5A800':p>0?'#1E7040':'#C8D5E8';}
function binfo(p){if(p>=1)return{c:'bfull',t:'Lleno'};if(p>=.7)return{c:'bmid',t:'Parcial'};if(p>0)return{c:'bok',t:'Espacio'};return{c:'bemp',t:'Vacío'};}
function fd(iso){if(!iso)return'';const d=new Date(iso);return d.toLocaleDateString('es-BO',{day:'2-digit',month:'2-digit',year:'2-digit'})+' '+d.toLocaleTimeString('es-BO',{hour:'2-digit',minute:'2-digit'});}
function fdS(s){if(!s)return'';const p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function fdate(s){if(!s)return{day:'--',mon:'---'};const p=s.split('-');const ms=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];return{day:p[2],mon:ms[+p[1]-1]};}
function uid(){return Math.random().toString(36).slice(2,9);}
function alog(act,det){S.changelog.unshift({id:uid(),act,det,user:S.user||'Anónimo',ts:new Date().toISOString()});if(S.changelog.length>200)S.changelog=S.changelog.slice(0,200);}
function esc(t){return(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hl(text,q){const safe=esc(text||'');if(!q||!q.trim())return safe;let r=safe;q.trim().split(/\s+/).filter(Boolean).forEach(w=>{const re=new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');r=r.replace(re,m=>'<mark>'+m+'</mark>');});return r;}
function matchStr(str,q){if(!q)return true;return q.toLowerCase().trim().split(/\s+/).every(w=>(str||'').toLowerCase().includes(w));}
function matches(item,q){if(!q)return true;return matchStr([item.desc,item.type,item.proj,item.oc,item.notes,item.unit,item.by,item.llegada].filter(Boolean).join(' '),q);}
function matchLog(l,q){return matchStr([l.act,l.det,l.user].filter(Boolean).join(' '),q);}
function projInput(id,val){return '<input class="fi" list="plist" id="'+id+'" value="'+esc(val||'')+'" placeholder="Hornos Fase 2, EPP..."><datalist id="plist">'+PROJ_HINTS.map(p=>'<option value="'+p+'">').join('')+'</datalist>';}
function getCantComp(cod){if(!cod)return 0;return S.ocs.reduce((t,oc)=>{const m=(oc.materiales||[]).find(m=>m.codigo===cod);return t+(m?+m.qty||0:0);},0);}
function getOCsForCod(cod){if(!cod)return[];return S.ocs.filter(oc=>(oc.materiales||[]).some(m=>m.codigo===cod));}
function getItemCls(item){
  if(item.estado==='anulado')return'ranu';
  const c=getCantComp(item.codigo);const req=+item.cantReq||0;
  if(c<=0)return'';
  if(req>0&&c>req)return'rbl';  // excedente → azul
  if(req>0&&c>=req)return'rg';  // completo → verde
  return'ry';                    // parcial → amarillo
}
function getProvNom(pid){const p=S.proveedores.find(p=>p.id===pid);return p?p.nombre:pid||'—';}

function getItemStatusInfo(item){
  const cls=getItemCls(item);
  if(cls==='ranu')return{ico:'⛔',txt:'Anulado'};
  if(cls==='rbl')return{ico:'🔵',txt:'Excedente'};
  if(cls==='rg')return{ico:'🟢',txt:'Completo'};
  if(cls==='ry')return{ico:'🟡',txt:'Parcial'};
  return{ico:'⚪',txt:'Sin compra'};
}
function getEstadoBadge(estado){
  const e=ITEM_ESTADOS.find(x=>x.id===estado)||ITEM_ESTADOS[0];
  return'<span class="eb '+e.cls+'">'+e.l+'</span>';
}
function applySort(items,key){
  const arr=[...items];
  const [field,dir]=key.split('-');const asc=dir==='asc';
  return arr.sort((a,b)=>{
    let va,vb;
    if(field==='cod'){va=a.codigo||'';vb=b.codigo||'';}
    else if(field==='desc'){va=a.desc||'';vb=b.desc||'';}
    else if(field==='falta'){va=Math.max(0,(+a.cantReq||0)-getCantComp(a.codigo));vb=Math.max(0,(+b.cantReq||0)-getCantComp(b.codigo));}
    else if(field==='estado'){va=a.estado||'pendiente';vb=b.estado||'pendiente';}
    else if(field==='num'){va=a.numero||a.nombre||'';vb=b.numero||b.nombre||'';}
    else if(field==='nom'){va=a.nombre||'';vb=b.nombre||'';}
    else if(field==='fecha'){va=a.date||a.fechaEntrega||a.at||'';vb=b.date||b.fechaEntrega||b.at||'';}
    else{va=a.desc||a.material||'';vb=b.desc||b.material||'';}
    if(typeof va==='string')return asc?va.localeCompare(vb):vb.localeCompare(va);
    return asc?va-vb:vb-va;
  });
}
function rSortBar(tab,opts){
  return'<div class="sort-bar"><span style="font-size:9px;color:var(--txm);text-transform:uppercase;letter-spacing:.06em;flex-shrink:0">Orden:</span>'+
  opts.map(o=>'<button class="srt-btn'+(sortState[tab]===o.k?' act':'')+'" onclick="setSortState(\\\''+tab+'\\\',\\\''+o.k+'\\\')">'+
    (sortState[tab]===o.k?'<i class="ti '+(o.k.endsWith('asc')?'ti-sort-ascending':'ti-sort-descending')+'" style="font-size:9px"></i> ':'')+o.l+'</button>').join('')+
  '</div>';
}
function setSortState(tab,k){sortState[tab]=k;render();}
function rListaFilterBar(){
  const compOpts=[
    {k:'todos',l:'Todos',cls:'fp-all'},
    {k:'sinCompra',l:'⚪ Sin compra',cls:'fp-none'},
    {k:'parcial',l:'🟡 Parcial',cls:'fp-part'},
    {k:'completo',l:'🟢 Completo',cls:'fp-full'},
    {k:'excedente',l:'🔵 Excedente',cls:'fp-over'}
  ];
  const estadoOpts=[{k:'todos',l:'Todos los estados',cls:'fp-all'},...ITEM_ESTADOS.map(e=>({k:e.id,l:e.l,cls:'fp-all'}))];
  return'<div class="filter-bar">'+
    '<span style="font-size:9px;color:var(--txm);text-transform:uppercase;letter-spacing:.06em;flex-shrink:0;margin-right:2px">Compra:</span>'+
    compOpts.map(o=>'<button class="fp '+o.cls+(listaFiltroCompra===o.k?' act':'')+'" onclick="setListaFiltro(\'compra\',\''+o.k+'\')">'+o.l+'</button>').join('')+
    '<span style="width:1px;background:var(--bdr);height:16px;flex-shrink:0;margin:0 4px"></span>'+
    '<span style="font-size:9px;color:var(--txm);text-transform:uppercase;letter-spacing:.06em;flex-shrink:0;margin-right:2px">Estado:</span>'+
    estadoOpts.map(o=>'<button class="fp '+(listaFiltroEstado===o.k?'fp-all act':'')+'" onclick="setListaFiltro(\'estado\',\''+o.k+'\')" style="'+(o.k!=='todos'?'':'')+'">'+(o.k==='todos'?o.l:getEstadoBadge(o.k))+'</button>').join('')+
    '</div>';
}
function setListaFiltro(tipo,val){
  if(tipo==='compra')listaFiltroCompra=val;
  else listaFiltroEstado=val;
  render();
}
function applyListaFilters(items){
  return items.filter(item=>{
    // Filtro compra
    const cls=getItemCls(item);
    if(listaFiltroCompra!=='todos'){
      if(listaFiltroCompra==='sinCompra'&&cls!=='')return false;
      if(listaFiltroCompra==='parcial'&&cls!=='ry')return false;
      if(listaFiltroCompra==='completo'&&cls!=='rg')return false;
      if(listaFiltroCompra==='excedente'&&cls!=='rbl')return false;
    }
    // Filtro estado
    if(listaFiltroEstado!=='todos'){
      const est=item.estado||'pendiente';
      if(est!==listaFiltroEstado)return false;
    }
    return true;
  });
}
function flagEmoji(pais){const f={Bolivia:'🇧🇴',Argentina:'🇦🇷',Chile:'🇨🇱',Perú:'🇵🇪',Brasil:'🇧🇷',EEUU:'🇺🇸',Paraguay:'🇵🇾',China:'🇨🇳',España:'🇪🇸',Colombia:'🇨🇴',Uruguay:'🇺🇾'};return f[pais]||'🌐';}
function ocBadge(st){const m={recibido:'bok',aduana:'bmid',transito:'bmid',enviada:'bmid',aprobada:'brecv',revision:'bpend',cotizacion:'bemp'};return m[st]||'bemp';}
function allItems(){const a=[];DISCIPLINAS.forEach(d=>(S.listas[d.id]||[]).forEach(i=>a.push(Object.assign({},i,{disc:d.id}))));return a;}

function render(){document.getElementById('app').innerHTML=rApp();}
function rApp(){
  const t=localLM?new Date(localLM).toLocaleTimeString('es-BO',{hour:'2-digit',minute:'2-digit'}):'—';
  const noSearch=S.tab==='calculadora';
  return '<div class="app">'+
    (toastMsg?'<div class="tbanner"><i class="ti ti-check-circle" style="font-size:13px"></i>'+esc(toastMsg)+'</div>':'')+
    '<div class="hdr"><div class="hbrand">'+
    '<svg width="26" height="28" viewBox="0 0 26 28" fill="none"><path d="M13 1C11 6 7 8 7 14c0 5 3 8 6 10-3-3-4-6-2.5-10 1 3 2.5 5 2.5 5s1.5-3 1.5-6c1 2.5 1 6-.5 8.5 3-2 5-5 5-7.5 0-6-4-8-6-13z" fill="#F5A800"/><path d="M13 5c-1 3-4 5-4 9 0 3 2 6 4 8-2-3-3-5-2-8 1 2 2 3.5 2 3.5s1.5-2.5 1.5-5c.5 2 .5 5-.5 7 2-2 3-4 3-6 0-4-2-6-4-9z" fill="#CC2200"/></svg>'+
    '<div class="hsep"></div><div class="htitle"><b>COBOLCE</b>Almacén Virtual BPG</div></div>'+
    '<div class="hright"><div class="sync"><span class="sdot"></span>Sync '+t+'</div>'+
    '<button class="ibtn" onclick="toggleDark()"><i class="ti '+(S.dark?'ti-sun':'ti-moon')+'" style="font-size:13px"></i>'+(S.dark?'Claro':'Oscuro')+'</button>'+
    '<button class="ibtn" onclick="showUsr()"><i class="ti ti-user-circle" style="font-size:13px"></i>'+(S.user||'Identificarse')+'</button></div></div>'+
    '<div class="tabs">'+[
      {id:'mapa',ic:'ti-building-warehouse',l:'Mapa'},
      {id:'listas',ic:'ti-list-check',l:'Listas'},
      {id:'oc',ic:'ti-file-invoice',l:'Órd. de Compra'},
      {id:'proveedores',ic:'ti-truck',l:'Proveedores'},
      {id:'calculadora',ic:'ti-weight',l:'Calculadora'},
      {id:'cotiz',ic:'ti-receipt',l:'Cotiz.'},
      {id:'dashboard',ic:'ti-dashboard',l:'Dashboard'},
      {id:'agenda',ic:'ti-calendar-event',l:'Agenda',badge:true},
      {id:'docs',ic:'ti-file-description',l:'Documentos'},
      {id:'registro',ic:'ti-history',l:'Registro'}
    ].map(t=>'<div class="tab'+(S.tab===t.id?' act':'')+'" onclick="setTab(\''+t.id+'\')"><i class="ti '+t.ic+'"></i>'+t.l+'</div>').join('')+'</div>'+
    (!noSearch?'<div class="searchbar"><i class="ti ti-search" style="font-size:15px;color:var(--txm)"></i>'+
    '<input class="srch" id="srch" placeholder="'+rSP()+'" value="'+(searches[S.tab]||'')+'" oninput="setSearch(this.value)">'+
    (searches[S.tab]?'<button class="clrbtn" onclick="clearSearch()"><i class="ti ti-x"></i></button>':'')+'</div>':'')+
    '<div class="body">'+
    (S.tab==='mapa'&&!searches.mapa?rSB():'')+
    '<div class="main">'+rMain()+'</div></div>'+
    (selSet.size>0?rSelBar():'')+
    (modal?rMover():'')+
    '</div>';
}
function rSP(){const ps={mapa:'Buscar material...',agenda:'Buscar entrega...',docs:'Buscar documento...',registro:'Buscar en registro...',listas:'Buscar por código, descripción...',oc:'Buscar por número, proveedor...',proveedores:'Buscar proveedor...',cotiz:'Buscar comparativo...',dashboard:''};return ps[S.tab]||'Buscar...';}
function rMain(){if(S.tab==='mapa')return rMapa();if(S.tab==='listas')return rListas();if(S.tab==='oc')return rOC();if(S.tab==='cotiz')return rCotiz();if(S.tab==='proveedores')return rProveedores();if(S.tab==='dashboard')return rDashboard();if(S.tab==='calculadora')return rCalc();if(S.tab==='agenda')return rAg();if(S.tab==='docs')return rDocs();return rLog();}
function rSB(){return'<div class="sb"><div class="sblbl">Zonas</div>'+[
  {id:'hab1',ic:'ti-layout-grid',l:'Habitación 1',s:'7 gabinetes'},
  {id:'hab2',ic:'ti-layout-grid',l:'Habitación 2',s:'7 gabinetes'},
  {id:'caseta',ic:'ti-home-2',l:'Caseta',s:'Ladrillos'},
  {id:'intemperie',ic:'ti-sun-wind',l:'Intemperie',s:'Garaje exterior'},
  {id:'cotoca',ic:'ti-map-pin',l:'Cotoca',s:'Almacén externo'}
].map(r=>'<div class="sbi'+(S.room===r.id?' act':'')+'" onclick="setRoom(\''+r.id+'\')"><i class="ti '+r.ic+'"></i><div><div>'+r.l+'</div><div class="sbsub">'+r.s+'</div></div></div>').join('')+'</div>';}

function rMapa(){
  const q=searches.mapa;
  if(!q){}; // alert handled below
  if(q){const res=searchMapa(q);if(!res.length)return '<div class="nodata"><i class="ti ti-search-off"></i>Sin resultados para "'+esc(q)+'"</div>';
    return'<div style="margin-bottom:8px;font-size:11px;color:var(--txm)">'+res.length+' resultado'+(res.length>1?'s':'')+' encontrado'+(res.length>1?'s':'')+' para "'+esc(q)+'"</div>'+
    res.map(r=>'<div class="sres"><span style="font-size:15px;flex-shrink:0;margin-top:2px">'+iti(r.item.type).ic+'</span><div style="flex:1;min-width:0">'+
      '<div style="font-size:12px;font-weight:500;color:var(--tx)">'+hl(r.item.desc,q)+'</div>'+
      '<div style="font-size:10px;color:var(--txm);margin-top:2px"><i class="ti ti-map-pin" style="font-size:10px;vertical-align:-1px"></i> '+esc(r.location)+'</div>'+

function searchMapa(q){
  const res=[];

function svLI(){
  if(!S.user){tst('Identifícate primero');return;}
  const disc=document.getElementById('li-disc')?.value||modal.d.disc;
  const cod=document.getElementById('li-cod')?.value?.trim();const desc=document.getElementById('li-desc')?.value?.trim();
  if(!cod){tst('El código es obligatorio');return;}if(!desc){tst('La descripción es obligatoria');return;}
  const origDisc=modal.d.disc;const ei=modal.d.ei;
  const existing=(S.listas[disc]||[]).findIndex(i=>i.codigo===cod);
  if(existing>=0&&(disc!==origDisc||existing!==ei)){tst('El código '+cod+' ya existe en '+DISCIPLINAS.find(d=>d.id===disc)?.l);return;}
  const item={id:uid(),codigo:cod,desc,unidad:document.getElementById('li-und')?.value?.trim()||'',cantReq:+document.getElementById('li-qty')?.value||0,pesoUnit:+document.getElementById('li-pw')?.value||0,estado:document.getElementById('li-est')?.value||'pendiente',notas:document.getElementById('li-notes')?.value?.trim()||'',by:S.user,at:new Date().toISOString()};
  if(!S.listas[disc])S.listas[disc]=[];
  if(ei!==undefined&&disc===origDisc){item.id=S.listas[disc][ei].id;item.by=S.listas[disc][ei].by;item.at=S.listas[disc][ei].at;S.listas[disc][ei]=item;}
  else if(ei!==undefined&&disc!==origDisc){S.listas[origDisc].splice(ei,1);S.listas[disc].push(item);}
  else{S.listas[disc].push(item);}
  S.disc=disc;alog('Ítem '+(ei!==undefined?'editado':'agregado')+' en Lista '+DISCIPLINAS.find(d=>d.id===disc)?.l,cod+' — '+desc);
  sv(['listas','log']);modal=null;render();tst('Ítem guardado');
}

function getAlerts() {
  const today = new Date(); today.setHours(0,0,0,0);
  const in7 = new Date(today.getTime() + 7*86400000);
  const todayS = today.toISOString().slice(0,10);
  const in7S = in7.toISOString().slice(0,10);
  const overdue = S.agenda.filter(a => a.date < todayS && a.status !== 'received');
  const upcoming = S.agenda.filter(a => a.date >= todayS && a.date <= in7S && a.status !== 'received');
  return { overdue, upcoming };
}

function findInWarehouse(codigo) {
  const locs = [];
  for (const r of ['hab1','hab2']) {
    const cfg = S.config[r] || {gabs:7,lvls:4};
    for (let g = 1; g <= (cfg.gabs||7); g++)
      for (let l = 1; l <= (cfg.lvls||4); l++)
        (gld(r,g,l).items||[]).forEach(it => {
          if (it.liCod === codigo || it.oc === codigo)
            locs.push({loc:(r==='hab1'?'Hab.1':'Hab.2')+' Gab.'+g+' N'+l, it});
        });
    (S.pallets[r]||[]).forEach(p => (p.items||[]).forEach(it => {
      if (it.liCod === codigo) locs.push({loc:(r==='hab1'?'Hab.1':'Hab.2')+' Pallet: '+p.lbl, it});
    }));
  }
  for (const z of ['caseta','intemperie','cotoca'])
    (S.zoneItems[z]||[]).forEach(it => {
      if (it.liCod === codigo) locs.push({loc:z==='caseta'?'Caseta':z==='intemperie'?'Intemperie':'Cotoca', it});
    });
  return locs;
}

function getWarehouseByProj(proj) {
  const items = [];
  for (const r of ['hab1','hab2']) {
    const cfg = S.config[r]||{gabs:7,lvls:4};
    for (let g=1;g<=(cfg.gabs||7);g++)
      for (let l=1;l<=(cfg.lvls||4);l++)
        (gld(r,g,l).items||[]).filter(i=>i.proj===proj).forEach(i=>items.push({...i,loc:(r==='hab1'?'Hab.1':'Hab.2')+' Gab.'+g+' N'+l}));
  }
  for (const z of ['caseta','intemperie','cotoca'])
    (S.zoneItems[z]||[]).filter(i=>i.proj===proj).forEach(i=>items.push({...i,loc:z}));
  return items;
}

function getOCrecibida(mat) {
  return (mat.recepciones||[]).reduce((a,r)=>a+(+r.qty||0),0);
}

function cotizBest(cotiz, itemId) {
  let best=null, bp=Infinity;
  (cotiz.cols||[]).forEach(col=>{
    const k=itemId+':'+col.id; const p=cotiz.precios?.[k];
    if(p!==undefined && +p < bp){bp=+p;best=col;}
  });
  return {col:best, price:bp===Infinity?null:bp};
}

function selGetItems() {

  DISCIPLINAS.forEach(d => (S.listas[d.id]||[]).forEach(i => {

  }));
  return items;
}

function rCotiz() {
  if (cotizEditId) return rCotizEditor();
  const q = searches.cotiz||'';
  let cotizs = [...(S.cotizaciones||[])];
  if (q) cotizs = cotizs.filter(c => matchStr([c.nombre,c.proj].filter(Boolean).join(' '), q));
  return '<div class="ph"><div><div class="phtitle">Cuadros Comparativos</div>'+
    '<div class="phsub">Comparación de cotizaciones de proveedores</div></div>'+
    '<button class="btn btnp" onclick="oNewCotiz()"><i class="ti ti-plus"></i> Nuevo comparativo</button></div>'+
    (!cotizs.length?'<div class="nodata"><i class="ti ti-table-off"></i>Sin comparativos registrados. Crea uno para comparar cotizaciones de varios proveedores.</div>':
    cotizs.map(c => {
      const totalItems = (c.items||[]).length, totalCols = (c.cols||[]).length;
      // Find overall winner (most items with best price)
      const winCount = {};
      (c.items||[]).forEach(item => {
        const b = cotizBest(c, item.id);
        if (b.col) winCount[b.col.id] = (winCount[b.col.id]||0)+1;
      });
      const winnerId = Object.entries(winCount).sort((a,b)=>b[1]-a[1])[0]?.[0];
      const winner = (c.cols||[]).find(col=>col.id===winnerId);
      return '<div class="cotiz-card"><div class="oc-hdr">'+
        '<div style="flex:1;min-width:0">'+
        '<div style="font-size:13px;font-weight:500;color:var(--tx)">'+esc(c.nombre)+'</div>'+
        '<div class="oc-meta">'+(c.proj?'📁 '+esc(c.proj)+' · ':'')+(c.fecha?fdS(c.fecha)+' · ':'')+totalItems+' ítem'+(totalItems!==1?'s':'')+' · '+totalCols+' proveedor'+(totalCols!==1?'es':'')+'</div>'+
        (winner?'<div style="font-size:11px;color:var(--grn-tx);margin-top:4px">🏆 Mejor precio global: <b>'+esc(winner.nombre)+'</b></div>':'')+
        '</div>'+
        '<div class="brow">'+
        '<button class="btn btnxs" onclick="oEditCotizPrecios(\''+c.id+'\')"><i class="ti ti-table"></i> Editar precios</button>'+
        '<button class="btn btnxs" onclick="exportCotiz(\''+c.id+'\')"><i class="ti ti-download"></i> Excel</button>'+
        (c.cols&&c.cols.length?'<button class="btn btnxs brecv" onclick="cotizToOC(\''+c.id+'\')"><i class="ti ti-file-invoice"></i> → OC</button>':'')+
        '<button class="btn btnxs" onclick="oEditCotiz(\''+c.id+'\')"><i class="ti ti-edit"></i></button>'+
        '<button class="btn btnxs btnd" onclick="dCotiz(\''+c.id+'\')"><i class="ti ti-trash"></i></button>'+
        '</div></div>'+
        (c.notas?'<div style="font-size:10px;color:var(--txm);margin-top:6px;font-style:italic">'+esc(c.notas)+'</div>':'')+
        '</div>';
    }).join(''));
}

function rCotizEditor() {
  const c = (S.cotizaciones||[]).find(x=>x.id===cotizEditId);
  if (!c) { cotizEditId=null; return rCotiz(); }
  // Build table: rows=items, cols=suppliers
  const colHeaders = (c.cols||[]).map(col=>'<th style="min-width:110px;text-align:center">'+esc(col.nombre)+'<br><button class="btn btnxs btnd" style="margin-top:3px;font-size:9px" onclick="cotizRemoveCol(\''+cotizEditId+'\',\''+col.id+'\')"><i class="ti ti-x"></i></button></th>').join('');
  const rows = (c.items||[]).map(item => {
    const priceCells = (c.cols||[]).map(col => {
      const key = item.id+':'+col.id;
      const val = c.precios?.[key] ?? '';
      const best = cotizBest(c, item.id);
      const isBest = best.col?.id === col.id && val !== '';
      return '<td style="text-align:center" id="pcell-'+key+'">'+
        '<input class="price-input'+(isBest?' best-cell':'')+'" id="pinp-'+key+'" type="number" min="0" step="0.01" value="'+val+'" placeholder="—" onchange="updatePx(\''+cotizEditId+'\',\''+key+'\',this.value)" style="width:80px">'+
        '</td>';
    }).join('');
    const best = cotizBest(c, item.id);
    const total = best.price !== null ? (best.price * (+item.cantReq||0)).toFixed(2) : '—';
    return '<tr>'+
      '<td><span class="cod">'+esc(item.codigo||'—')+'</span></td>'+
      '<td style="max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(item.desc)+'</td>'+
      '<td style="text-align:center;color:var(--txm)">'+esc(item.unidad||'—')+'</td>'+
      '<td style="text-align:center;font-weight:500">'+( item.cantReq||0)+'</td>'+
      priceCells+
      '<td style="text-align:center;background:var(--bg2)">'+
        '<div style="font-size:10px;color:var(--grn-tx);font-weight:500">'+(best.col?'$'+best.price:' — ')+'</div>'+
        '<div style="font-size:9px;color:var(--txm)">'+(best.col?esc(best.col.nombre):'')+'</div>'+
      '</td>'+
      '<td style="text-align:right;font-weight:500;color:var(--n)">'+total+'</td>'+
      '<td><button class="btn btnxs btnd" onclick="cotizRemoveItem(\''+cotizEditId+'\',\''+item.id+'\')"><i class="ti ti-x"></i></button></td>'+
    '</tr>';
  }).join('');
  // Totals row per supplier
  const totalCells = (c.cols||[]).map(col => {
    const tot = (c.items||[]).reduce((sum,item) => {
      const k = item.id+':'+col.id; const p = c.precios?.[k];
      return sum + (p !== undefined ? +p * (+item.cantReq||0) : 0);
    }, 0);
    const best = false; // compare totals
    return '<td style="text-align:center;font-weight:600;background:var(--bg2);font-family:monospace">$'+tot.toFixed(2)+'</td>';
  }).join('');

  return '<div class="ph">'+
    '<div><div class="phtitle">'+esc(c.nombre)+'</div><div class="phsub">'+(c.proj||'')+(c.fecha?' · '+fdS(c.fecha):'')+'</div></div>'+
    '<div class="brow">'+
    '<button class="btn btnxs" onclick="exportCotiz(\''+cotizEditId+'\')"><i class="ti ti-download"></i> Excel</button>'+
    '<button class="btn btnxs btnp" onclick="cotizSavePrecios()"><i class="ti ti-check"></i> Guardar</button>'+
    '<button class="btn btnxs" onclick="cotizEditId=null;render()"><i class="ti ti-arrow-left"></i> Volver</button>'+
    '</div></div>'+
    '<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">'+
    '<button class="btn btnxs" onclick="cotizAddItemUI()"><i class="ti ti-plus"></i> Ítem</button>'+
    '<button class="btn btnxs" onclick="cotizAddColUI()"><i class="ti ti-user-plus"></i> Proveedor</button>'+
    '</div>'+
    (!(c.items||[]).length?'<div class="nodata"><i class="ti ti-table-off"></i>Agrega ítems y proveedores para comenzar</div>':
    '<div class="cotiz-wrap"><table class="cotiz-tbl">'+
    '<thead><tr>'+
    '<th>Código</th><th>Descripción</th><th style="text-align:center">Und.</th><th style="text-align:center">Cant.</th>'+
    colHeaders+
    '<th style="text-align:center;background:var(--grn-bg)">Mejor p/ud</th>'+
    '<th style="text-align:right">Total mejor</th><th></th></tr></thead>'+
    '<tbody>'+rows+
    '<tr style="font-weight:600;background:var(--bg2)">'+
    '<td colspan="4" style="text-align:right;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--txm)">TOTALES</td>'+
    totalCells+
    '<td colspan="3"></td></tr>'+
    '</tbody></table></div>');
}

}
function clearSel() { selSet.clear(); render(); }

function cotizAddItemUI() {
  const cod = prompt('Código del ítem (de la lista):');
  if (!cod) return;
  let found = null;
  for (const items of Object.values(S.listas)) { const f=items.find(i=>i.codigo===cod); if(f){found=f;break;} }
  const c = S.cotizaciones.find(x=>x.id===cotizEditId);
  if (!c) return;
  if (!c.items) c.items = [];
  if (c.items.find(i=>i.codigo===cod)) { tst('Ese código ya está en el comparativo'); return; }
  c.items.push({id:uid(), codigo:cod, desc:found?.desc||cod, unidad:found?.unidad||'', cantReq:found?.cantReq||0});
  sv(['cotiz']); render();
}
function cotizAddColUI() {
  const nom = prompt('Nombre del proveedor:');
  if (!nom) return;
  const c = S.cotizaciones.find(x=>x.id===cotizEditId);
  if (!c) return;
  if (!c.cols) c.cols=[];
  const prov = S.proveedores.find(p=>p.nombre===nom);
  c.cols.push({id:uid(), nombre:nom, provId:prov?.id||''});
  sv(['cotiz']); render();
}
function cotizRemoveItem(cotizId, itemId) {
  const c = S.cotizaciones.find(x=>x.id===cotizId);
  if (!c) return;
  c.items = c.items.filter(i=>i.id!==itemId);
  Object.keys(c.precios||{}).filter(k=>k.startsWith(itemId+':')).forEach(k=>delete c.precios[k]);
  sv(['cotiz']); render();
}
function cotizRemoveCol(cotizId, colId) {
  const c = S.cotizaciones.find(x=>x.id===cotizId);
  if (!c) return;
  c.cols = c.cols.filter(col=>col.id!==colId);
  Object.keys(c.precios||{}).filter(k=>k.endsWith(':'+colId)).forEach(k=>delete c.precios[k]);
  sv(['cotiz']); render();
}
function ctAutoFill() {
  const cod = document.getElementById('ct-icod')?.value?.trim();
  if (!cod) return;
  for (const items of Object.values(S.listas)) {
    const f = items.find(i=>i.codigo===cod);
    if (f) {
      const d=document.getElementById('ct-idesc'); const u=document.getElementById('ct-iund'); const q=document.getElementById('ct-iqty');
      if(d&&!d.value)d.value=f.desc; if(u&&!u.value)u.value=f.unidad||''; if(q&&!q.value)q.value=f.cantReq||''; return;
    }
  }

function ctAddItem() {
  const cod=document.getElementById('ct-icod')?.value?.trim()||'';
  let desc=document.getElementById('ct-idesc')?.value?.trim()||'';
  const qty=+document.getElementById('ct-iqty')?.value||0;
  const und=document.getElementById('ct-iund')?.value?.trim()||'';
  if(!cod&&!desc){tst('Ingresa código o descripción');return;}
  if(cotizItems.find(i=>i.codigo===cod&&cod)){tst('Ese código ya está en el comparativo');return;}
  if(cod&&!desc){for(const items of Object.values(S.listas)){const f=items.find(i=>i.codigo===cod);if(f){desc=f.desc;break;}}}
  cotizItems.push({id:uid(),codigo:cod,desc:desc||cod,unidad:und,cantReq:qty});
  render();
}
function ctRemItem(i){cotizItems.splice(i,1);render();}
function ctAddCol(){
  const nom=document.getElementById('ct-pnom')?.value?.trim();
  if(!nom){tst('Ingresa el nombre del proveedor');return;}
  if(cotizCols.find(c=>c.nombre===nom)){tst('Ese proveedor ya está');return;}

  render();
}
function ctRemCol(i){cotizCols.splice(i,1);render();}
function svCotiz(){
  if(!S.user){tst('Identifícate primero');return;}
  const nom=document.getElementById('ct-nom')?.value?.trim();
  if(!nom){tst('Ingresa un nombre para el comparativo');return;}
  const isEdit=!!modal.d?.id;
  const c={
    id:isEdit?modal.d.id:uid(), nombre:nom,
    proj:document.getElementById('ct-proj')?.value?.trim()||'',
    fecha:document.getElementById('ct-fecha')?.value||'',
    notas:document.getElementById('ct-notas')?.value?.trim()||'',
    items:[...cotizItems], cols:[...cotizCols],
    precios:isEdit?{...(S.cotizaciones.find(x=>x.id===modal.d.id)?.precios||{}),...cotizPrecios}:{...cotizPrecios},
    by:S.user,at:new Date().toISOString()
  };
  if(!S.cotizaciones)S.cotizaciones=[];
  if(isEdit){const idx=S.cotizaciones.findIndex(x=>x.id===c.id);if(idx>=0){c.by=S.cotizaciones[idx].by;c.at=S.cotizaciones[idx].at;S.cotizaciones[idx]=c;}else S.cotizaciones.push(c);}
  else S.cotizaciones.push(c);
  alog(isEdit?'Comparativo actualizado':'Comparativo creado',nom);
  sv(['cotiz','log']); modal=null;
  if(!isEdit){cotizEditId=c.id;} // auto-open price editor
  render(); tst(isEdit?'Comparativo guardado':'Comparativo creado. Ahora ingresa los precios.');

function dCotiz(id){
  if(!confirm('¿Eliminar este comparativo?'))return;
  S.cotizaciones=S.cotizaciones.filter(x=>x.id!==id);
  alog('Comparativo eliminado','');sv(['cotiz','log']);render();tst('Comparativo eliminado');
}
function cotizToOC(id){
  const c=S.cotizaciones.find(x=>x.id===id);if(!c)return;
  // Find winner col (most wins)
  const wins={};
  (c.items||[]).forEach(item=>{const b=cotizBest(c,item.id);if(b.col)wins[b.col.id]=(wins[b.col.id]||0)+1;});
  const winnerId=Object.entries(wins).sort((a,b)=>b[1]-a[1])[0]?.[0];
  const winner=(c.cols||[]).find(col=>col.id===winnerId);
  if(!winner){tst('No hay precios ingresados para determinar el ganador');return;}
  modalMats=(c.items||[]).map(item=>({codigo:item.codigo,desc:item.desc,qty:item.cantReq,unidad:item.unidad}));
  const prov=S.proveedores.find(p=>p.id===winner.provId||p.nombre===winner.nombre);
  modal={s:'oc',d:{_init:true,item:{provId:prov?.id||'',proj:c.proj||'',numero:'OC-'+new Date().getFullYear()+'-'}}};
  // Set winner prov
  if(prov) modal.d.item.provId=prov.id;
  render();tst('OC pre-cargada con proveedor ganador: '+winner.nombre);
}
function updatePx(cotizId, key, val){
  const c=S.cotizaciones.find(x=>x.id===cotizId);if(!c)return;
  if(!c.precios)c.precios={};
  if(val!=='')c.precios[key]=parseFloat(val)||0; else delete c.precios[key];
  // Update best highlighting in DOM without full re-render
  const itemId=key.split(':')[0];
  const item=(c.items||[]).find(i=>i.id===itemId);
  if(!item)return;
  const best=cotizBest(c,itemId);
  (c.cols||[]).forEach(col=>{
    const k=itemId+':'+col.id;
    const inp=document.getElementById('pinp-'+k);
    if(inp){inp.classList.toggle('best-cell',col.id===best.col?.id&&c.precios?.[k]!==undefined);}
  });
  // Update best col in bestcell
  const bestTd=document.getElementById('pcell-'+itemId+':best');
}

function oRecepcion(ocId, matIdx){

function svRecepcion(){
  if(!S.user){tst('Identifícate primero');return;}
  const{ocId,matIdx}=modal.d;
  const oc=S.ocs.find(o=>o.id===ocId);
  if(!oc||!oc.materiales[matIdx])return;
  const fecha=document.getElementById('rec-fecha')?.value;
  const qty=+document.getElementById('rec-qty')?.value||0;
  if(!fecha||!qty){tst('Ingresa fecha y cantidad');return;}
  const mat=oc.materiales[matIdx];
  if(!mat.recepciones)mat.recepciones=[];
  mat.recepciones.push({id:uid(),fecha,qty,estado:document.getElementById('rec-est')?.value||'ok',notas:document.getElementById('rec-notas')?.value?.trim()||'',dest:document.getElementById('rec-dest')?.value?.trim()||'',by:S.user,at:new Date().toISOString()});
  // Auto-update OC status
  const allMats=oc.materiales;
  const allFull=allMats.every(m=>getOCrecibida(m)>=(+m.qty||0));
  const anyRec=allMats.some(m=>getOCrecibida(m)>0);
  if(allFull)oc.estado='recibido';
  else if(anyRec&&oc.estado!=='recibido')oc.estado='aduana';
  alog('Recepción registrada',oc.numero+' — '+mat.codigo+' '+qty+' '+mat.unidad);
  sv(['ocs','log']);modal=null;render();tst('Recepción registrada correctamente');
}

/* ===========================
   EXPORT EXCEL
   =========================== */
function exportExcel(type, cotizId) {
  if(typeof XLSX==='undefined'){tst('Cargando módulo de exportación...');return;}
  let wb=XLSX.utils.book_new(),ws,data,filename;
  if(type==='lista'){
    data=[['Código','Descripción','Disciplina','Unidad','Req.','Comprado','Falta','Estado','Peso unit. (kg)','En almacén (ubicación)','Notas']];
    DISCIPLINAS.forEach(d=>(S.listas[d.id]||[]).forEach(item=>{
      const comp=getCantComp(item.codigo);const falta=Math.max(0,(+item.cantReq||0)-comp);
      const cls=getItemCls(item);const est=cls==='rg'?'Completo':cls==='ry'?'Parcial':'Sin compra';
      const locs=findInWarehouse(item.codigo).map(l=>l.loc).join('; ');
      data.push([item.codigo,item.desc,d.l,item.unidad,item.cantReq||0,comp,falta,est,item.pesoUnit||0,locs,item.notas||'']);
    }));
    filename='COBOLCE_Listas.xlsx';
  } else if(type==='inventario'){
    data=[['Zona','Gabinete','Nivel','Tipo','Descripción','Cantidad','Unidad','Proyecto','Ref. OC','Fecha llegada','Notas','Ingresado por']];
    for(const r of['hab1','hab2']){const rn=r==='hab1'?'Habitación 1':'Habitación 2';const cfg=S.config[r]||{gabs:7,lvls:4};
      for(let g=1;g<=(cfg.gabs||7);g++)for(let l=1;l<=(cfg.lvls||4);l++)
        (gld(r,g,l).items||[]).forEach(it=>data.push([rn,'Gab.'+g,'N'+l,iti(it.type).l,it.desc,it.qty,it.unit||'',it.proj||'',it.oc||'',it.llegada||'',it.notes||'',it.by||'']));
    }
    for(const z of['caseta','intemperie','cotoca']){const zn=z==='caseta'?'Caseta':z==='intemperie'?'Intemperie':'Cotoca';
      (S.zoneItems[z]||[]).forEach(it=>data.push([zn,'','',iti(it.type).l,it.desc,it.qty,it.unit||'',it.proj||'',it.oc||'',it.llegada||'',it.notes||'',it.by||'']));}
    filename='COBOLCE_Inventario.xlsx';
  } else if(type==='ocs'){
    data=[['N° OC','Proveedor','Proyecto','Fecha emisión','Fecha entrega est.','Estado','Materiales (código x cant.)','Notas']];
    S.ocs.forEach(oc=>{
      const mats=(oc.materiales||[]).map(m=>esc(m.codigo||'—')+' x'+m.qty+' '+esc(m.unidad||'')).join('; ');
      data.push([oc.numero,getProvNom(oc.provId),oc.proj||'',oc.fechaEmision||'',oc.fechaEntrega||'',OC_STATES.find(s=>s.id===oc.estado)?.l||oc.estado,mats,oc.notas||'']);
    });
    filename='COBOLCE_OCs.xlsx';
  } else if(type==='cotiz'){
    const c=S.cotizaciones.find(x=>x.id===cotizId);if(!c)return;
    const hdr=['Código','Descripción','Unidad','Cant.'];
    (c.cols||[]).forEach(col=>hdr.push(col.nombre));
    hdr.push('Mejor precio/ud','Proveedor ganador','Total (mejor precio)');
    data=[hdr];
    (c.items||[]).forEach(item=>{
      const row=[item.codigo,item.desc,item.unidad,item.cantReq||0];
      let bp=Infinity,bc=null;
      (c.cols||[]).forEach(col=>{const k=item.id+':'+col.id;const p=c.precios?.[k];row.push(p!==undefined?+p:'');if(p!==undefined&&+p<bp){bp=+p;bc=col;}});
      row.push(bc?bp:''); row.push(bc?bc.nombre:''); row.push(bc?bp*(item.cantReq||0):'');
      data.push(row);
    });
    const totalRow=['','','','TOTALES'];
    (c.cols||[]).forEach(col=>{const tot=(c.items||[]).reduce((s,item)=>{const k=item.id+':'+col.id;const p=c.precios?.[k];return s+(p!==undefined?+p*(item.cantReq||0):0);},0);totalRow.push(tot||'');});
    data.push(totalRow);
    filename='COBOLCE_Cotiz_'+(c.nombre||'comparativo').replace(/\s+/g,'_')+'.xlsx';
  }
  ws=XLSX.utils.aoa_to_sheet(data);
  ws['!cols']=Array(data[0]?.length||1).fill({wch:20});
  XLSX.utils.book_append_sheet(wb,ws,'Datos');
  XLSX.writeFile(wb,filename);
  tst('Exportando '+filename+'...');
}
function exportCotiz(id){exportExcel('cotiz',id);}


</script>
